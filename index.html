<style>

.dmav2{display:flex}.dmav2 img,.dmav2>*{margin-right:-6px}.dmempty{color:var(--muted);font-size:13px;text-align:center;margin:24px 8px}.dmday{align-self:center;font-size:11px;color:var(--muted);background:var(--list);border-radius:99px;padding:2px 10px;margin:8px 0 4px}.dmmsg{display:flex;flex-direction:column;align-items:flex-start;max-width:82%;margin:2px 0}.dmmsg.me{align-self:flex-end;align-items:flex-end}.dmbub{background:var(--list);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:14px;line-height:1.4;white-space:normal;word-break:break-word}.dmmsg.me .dmbub{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px}.dmwho{font-size:11px;font-weight:700;color:var(--muted);margin:0 4px 1px}.dmtime{font-size:10px;color:#9AA3B2;margin:1px 4px 0}.dmform{display:flex;gap:6px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--line)}.dmform textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;max-height:110px}.duehead{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line)}.duehead h3{margin:0;font:700 15px/1.2 var(--fd)}.duehead.over{border-color:#E8A3A3}.duehead.over h3{color:var(--bad)}.duehead.today{border-color:var(--accent)}.duehead.today h3{color:var(--accent)}.aibar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0 2px}.aibar span{display:block;height:100%}.wonum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;font:700 13px/1 var(--fd);flex:none;padding:0 6px}.wonum.hi{background:#C62828}.polist{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}.porow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.porow.hi{border-color:#E8A3A3;background:#FFF6F6}.porow.subdrop{outline:2px dashed const queues={};
function write(path,data){
  if(!S.db){toast("Not connected – changes can't be saved.");return Promise.resolve();}
  queues[path]=(queues[path]||Promise.resolve()).then(()=>S.db.doc(path).set(data)).catch(e=>{
    const c=e&&e.code;
    toast(c==="invalid_argument"?"You don't have permission to change this. Ask HR to check your access in the Share menu.":c==="quota_exceeded"?"Storage is full – ask HR to archive old cards.":"Couldn't save – please try again.");
  });
  return queues[path];
}
function logAct(text,cid,extra){if(!S.db||!S.me)return;const ex=extra||{};const cc=ex.card&&(S.cards[ex.card]||S.messages[ex.card]);const priv=(cc&&cc.board&&isPriv(cc.board))||(ex.board&&isPriv(ex.board));S.db.collection(priv?"pactivity":"activity").doc().set(Object.assign({at:Date.now(),by:S.me,text:String(text).slice(0,500),client:cid||""},extra||{})).catch(()=>{});}
function del(path){if(!S.db)return;S.db.doc(path).delete().catch(()=>toast("Couldn't delete – please try again."));}
function pushHist(card,ev){card.hist=card.hist||[];card.hist.unshift(Object.assign({at:Date.now(),by:S.me},ev));if(card.hist.length>150)card.hist.length=150;}

/* ---------- time logs & ratings ---------- */
const lkey=(cid,sid)=>cid+"__"+sid;
const logOf=u=>S.logs[u]||{running:null,logs:{}};
function subLog(sub,cid){const L=logOf(sub.a);return(L.logs&&L.logs[lkey(cid,sub.id)])||{s:[],fin:{}};}
function runOf(sub,cid){const L=logOf(sub.a);return L.running&&L.running.k===lkey(cid,sub.id)?L.running:null;}
function usedMs(sub,cid,round){let t=0;for(const x of subLog(sub,cid).s||[])if(round==null||x[2]===round)t+=x[1]-x[0];const r=runOf(sub,cid);if(r&&(round==null||r.r===round))t+=Date.now()-r.t;return t;}
function rate(sub,cid){
  const lg=subLog(sub,cid),fin=Object.assign({},lg.fin||{}),round=sub.round||0;if(sub.closed&&fin[String(sub.closed.round||0)]==null)fin[String(sub.closed.round||0)]=sub.closed.at;const fin0=fin["0"],cur=fin[String(round)];
  let st=5;const lines=[];
  if(sub.day){
    if(fin0){const fd=dayOf(fin0);if(fd>sub.day){st-=2;lines.push(["Not finished on the allotted day",-2]);}else if(sub.min&&usedMs(sub,cid,0)>sub.min*60000){st-=1;lines.push(["Same day, but over the allotted time",-1]);}}
    else if(today()>sub.day){st-=2;lines.push(["Not finished on the allotted day",-2]);}
  }
  for(const r of sub.re||[]){const R=REASONS[r.reason]||REASONS_EXTRA[r.reason];if(R&&R.who==="worker"){st-=R.cut;lines.push([R.label,-R.cut]);}}
  st=Math.max(0,Math.round(st*10)/10);
  const done=!!cur,running=!!runOf(sub,cid);
  const status=done?"done":running?"running":(sub.day&&today()>sub.day&&!fin0)?"late":"todo";
  return{stars:st,lines,done,running,status,fin0,cur,firstDone:!!fin0};
}
function subOverdue(s,cid){if(!s.day)return false;const r=rate(s,cid);return r.fin0?dayOf(r.fin0)>s.day:today()>s.day;}
function assignerRate(card){const n=(card.subs||[]).reduce((t,s)=>t+(s.re||[]).filter(r=>r.reason==="other").length,0);const late=(card.subs||[]).filter(s=>subOverdue(s,card.id)).length;return{stars:Math.max(0,Math.round((5-0.2*n-1*late)*10)/10),n,late};}
function cardAvg(card){const subs=card.subs||[];if(!subs.length)return null;const v=subs.map(s=>rate(s,card.id).stars);return v.reduce((a,b)=>a+b,0)/v.length;}
function stageDone(card){const subs=(card.subs||[]).filter(s=>subStage(s)===card.col);return subs.length>0&&subs.every(s=>rate(s,card.id).done);}
function validStage(card,st){return isWork(card.board,st)?st:workCols(card.board)[0].id;}
function nextAfterApproval(card){for(const s of card.subs||[])if(!rate(s,card.id).done)return validStage(card,subStage(s));return fixedOn(card.board,"client")?"client":"done";}
function afterWork(card){return fixedOn(card.board,"int")?"int":nextAfterApproval(card);}
function firstCol(card){const s=(card.subs||[])[0];return s?validStage(card,subStage(s)):workCols(card.board)[0].id;}

/* ---------- worker timer actions ---------- */
function myLog(){const L=clone(logOf(S.me));L.logs=L.logs||{};return L;}
function closeRun(L,now){const r=L.running;if(!r)return;const e=L.logs[r.k]||(L.logs[r.k]={s:[],fin:{}});e.s=e.s||[];if(now>r.t)e.s.push([r.t,now,r.r]);L.running=null;}
function findSub(cid,sid){const c=S.cards[cid];return c&&(c.subs||[]).find(s=>s.id===sid);}
function startSub(cid,sid){const sub=findSub(cid,sid);if(!sub||sub.a!==S.me)return;{const why=startBlock(cid,sub);if(why){toast(why);return;}}const L=myLog(),now=Date.now();closeRun(L,now);L.running={k:lkey(cid,sid),t:now,r:sub.round||0,c:cid,s:sid};write("timelogs/"+S.me,L);logAct(`started the timer on ${subName(sub)} – “${S.cards[cid].title}”`,S.cards[cid].client,{card:cid});}
function stopSub(){const L=myLog();if(!L.running)return;const r=L.running;closeRun(L,Date.now());write("timelogs/"+S.me,L);const c=S.cards[r.c],sb=c&&findSub(r.c,r.s);if(c)logAct(`stopped the timer on ${sb?subName(sb):"a subtask"} – “${c.title}”`,c.client,{card:r.c});}
function finishSub(cid,sid,out){const sub=findSub(cid,sid);if(!sub||sub.a!==S.me)return;const L=myLog(),now=Date.now(),k=lkey(cid,sid);if(L.running&&L.running.k===k)closeRun(L,now);const e=L.logs[k]||(L.logs[k]={s:[],fin:{}});e.fin=e.fin||{};e.fin[String(sub.round||0)]=now;if(out){e.out=e.out||{};e.out[String(sub.round||0)]=Object.assign({at:now},out);}write("timelogs/"+S.me,L);toast("Finished – your head will review it.");logAct(`finished ${subName(sub)} – “${S.cards[cid].title}”`,S.cards[cid].client,{card:cid});}

/* ---------- head actions ---------- */
const isPriv=bid=>!!(S.boards[bid]&&S.boards[bid].restricted);
function saveCard(card){write((isPriv(card.board)?"pcards/":"cards/")+card.id,card);}
function moveCard(cid,col,note,auto){const c=clone(S.cards[cid]);if(!c||!canSubs())return;const from=c.col;c.col=col;if(col==="done")c.doneAt=Date.now();else delete c.doneAt;pushHist(c,Object.assign({t:"move",cid:c.board,from,to:col,note:note||""},auto?{auto:true,fby:auto.by||"",seenBy:S.me}:{}));saveCard(c);logAct(`${auto?"automatically ":""}moved “${c.title}” from ${colOf(c.board,from).name} to ${colOf(c.board,col).name}${note?" ("+note+")":""}`,c.client,Object.assign({card:c.id},auto&&auto.by?{by:auto.by,auto:true}:{}));}
function isAutoMove(h){return h&&h.t==="move"&&(h.auto||/^all .+ subtasks finished$/.test(h.note||""));}
function autoFinisher(c,h){if(h.fby)return h.fby;let best=null,bt=0;(c.subs||[]).forEach(x=>{if(subStage(x)!==h.from)return;const f=rate(x,c.id).fin0;if(f&&f<=h.at+60000&&f>bt){bt=f;best=x.a;}});return best;}
function lastFinisher(c){let best=null,bt=0;(c.subs||[]).forEach(x=>{if(subStage(x)!==c.col)return;const f=rate(x,c.id).fin0;if(f&&f>bt){bt=f;best=x.a;}});return best;}

function statusChip(r){return r.status==="done"?`<span class="chip good">Done · ${star(r.stars)}</span>`:r.status==="running"?`<span class="chip info">Running</span>`:r.status==="late"?`<span class="chip bad">Late · −2 ★</span>`:`<span class="chip">To do</span>`;}
function startBlock(cid,sub){const c=S.cards[cid];if(!c)return "This card no longer exists.";if(c.col===sub.stage)return null;
  const idx=(c.subs||[]).findIndex(x=>x.id===sub.id);const prev=(c.subs||[]).slice(0,Math.max(0,idx)).find(x=>!rate(x,cid).done);
  if(c.col==="done")return "This card is done.";
  if(c.col==="triage")return "This card is still in Triage. Your manager starts it.";
  if(c.col==="int")return `Waiting for internal approval${prev?` of ${subName(prev)} (${nm(prev.a).split(" ")[0]})`:""}.`;
  if(c.col==="client")return "Waiting for client approval.";
  if(c.col==="notnow")return "This card is on hold.";
  if(prev)return `Waiting for ${subName(prev)} (${nm(prev.a).split(" ")[0]}) to be finished and approved.`;
  return `This card is in ${colOf(c.board,c.col).name}. You can start when it reaches ${colOf(c.board,sub.stage).name}.`;}
function timerBtns(sub,cid,r,size){
  const xb=extraBadge(sub,cid);
  if(sub.a!==S.me||r.done)return xb;
  const used=usedMs(sub,cid);
  const blk=r.running?null:startBlock(cid,sub);
  return `<div class="row" style="gap:6px;flex-wrap:wrap">${r.running?`<button class="btn ${size} red" data-act="stop">Stop</button>`:`<button class="btn ${size} green" data-act="start" data-c="${cid}" data-s="${sub.id}" ${blk?`disabled title="${esc(blk)}"`:""}>Start</button>`}<button class="btn ${size} ghost" data-act="finish" data-c="${cid}" data-s="${sub.id}" ${used>0&&!blk?"":"disabled"}>Finish</button>${blk?"":reqBtn(sub,cid,size)}</div>${blk?`<div class="xs" style="color:#A35B00;margin-top:4px">⏸ ${esc(blk)}</div>`:""}${xb}`;
}
function tickSpan(sub,cid){const r=runOf(sub,cid);const base=usedMs(sub,cid)-(r?Date.now()-r.t:0);const over=sub.min&&usedMs(sub,cid)>sub.min*60000;return`<span class="tab ${over?"over":""}" style="font-weight:700" ${r?`data-tick="${r.t}" data-base="${base}"`:""}>${fmtDur(usedMs(sub,cid))}</span>`;}

function latestFor(key,cid){
  if(key==="t:messages")return Math.max(0,...Object.values(S.messages).filter(x=>inScope(x,cid,null)&&x.by!==S.me).map(x=>x.at||0),...Object.values(S.comments).filter(x=>{const m=S.messages[x.card];return m&&inScope(m,cid,null)&&x.by!==S.me;}).map(x=>x.at||0));
  if(key==="t:chat")return Math.max(0,...Object.values(S.chat).filter(x=>inScope(x,cid,null)&&x.by!==S.me).map(x=>x.at||0));
  if(key==="t:calendar")return Math.max(0,...Object.values(S.events).filter(x=>inScope(x,cid,null)&&x.by!==S.me).map(x=>x.at||0));
  if(key==="t:todos")return Math.max(0,...Object.values(S.todos).filter(x=>x.client===cid&&x.by!==S.me).map(x=>x.created||0));
  if(key==="t:docs")return Math.max(0,...Object.values(S.docs).filter(x=>x.client===cid&&x.by!==S.me).map(x=>x.edited||x.at||0));
  if(key==="t:checkins")return Math.max(0,...Object.values(S.answers).filter(x=>x.client===cid&&x.by!==S.me).map(x=>x.at||0));
  if(key==="t:content")return Math.max(0,...Object.values(S.ccal).filter(x=>x.client===cid&&x.by!==S.me).map(x=>x.edited||x.at||0),...Object.values(S.ccal).filter(x=>x.kind==="month"&&x.client===cid).map(x=>{const h=(x.hist||[])[0];return h&&h.by!==S.me?h.at:0;}));
  if(key==="t:links")return Math.max(0,...Object.values(S.links).filter(x=>x.client===cid&&x.by!==S.me).map(x=>x.at||0));
  if(key.startsWith("b:")){const bid=key.slice(2);let t=0;for(const c of Object.values(S.cards))if(c.board===bid)for(const h of (c.hist||[]).slice(0,5))if(h.by!==S.me&&h.at>t)t=h.at;return t;}
  return 0;
}

function weekRange(){const d=new Date();const wd=(d.getDay()+6)%7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd);const sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);return[dayOf(mon.getTime()),dayOf(sun.getTime())];}

function personStats(month){
  const isDesigner=u=>/design/i.test(desig(u));
  const P={};const get=u=>P[u]||(P[u]={id:u,items:0,done:0,onTime:0,stars:[],designer:[],ratio:[],ms:0,am:{cards:0,other:0,late:0,stars:[]}});
  for(const c of Object.values(S.cards)){
    for(const s of c.subs||[]){if(!s.a)continue;
      if(monthOf(s.day)===month){const p=get(s.a),r=rate(s,c.id);p.items++;if(r.firstDone){p.done++;if(!r.lines.some(l=>l[1]===-2||l[1]===-1))p.onTime++;if(s.min){p.ratio.push(usedMs(s,c.id,0)/(s.min*60000));}}if(r.firstDone||r.status==="late"){p.stars.push(r.stars);if(subStage(s)==="designer"&&isDesigner(s.a))p.designer.push(r.stars);}}}
    if(c.assigner&&monthOf(dayOf(c.created||0))===month){const p=get(c.assigner),a=assignerRate(c);p.am.cards++;p.am.other+=a.n;p.am.late+=a.late;p.am.stars.push(a.stars);}
  }
  for(const u in S.logs){const L=S.logs[u];for(const k in (L.logs||{}))for(const x of L.logs[k].s||[])if(dayOf(x[0]).slice(0,7)===month)get(u).ms+=x[1]-x[0];}
  return Object.values(P);
}

function myNameRe(){const m=memberOf(S.me);const n=(m&&m.name)||(S.meP&&S.meP.name)||"";if(!n)return null;const first=n.split(" ")[0];return new RegExp("@("+[n,first].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","i");}
function heyItems(){
  if(!S.me)return[];const out=[];const re=myNameRe();
  for(const c of Object.values(S.cards)){
    for(const h of c.hist||[]){if(h.by===S.me)continue;
      if(h.t==="create"&&(c.subs||[]).some(s=>s.a===S.me)){const hi=(c.subs||[]).some(s=>s.a===S.me&&isHi(s));out.push({mine:true,at:c.created||h.at,icon:hi?"🔥":"🗂",text:`${nm(h.by)} assigned you a ${hi?"HIGH-PRIORITY ":""}subtask on “${c.title}”${hi?" – do it first":""}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});}
      if(h.t==="pri"&&h.to===S.me&&h.pri==="high")out.push({mine:true,at:h.at,icon:"🔥",text:`${nm(h.by)} marked your ${h.sname||"subtask"} on “${c.title}” as HIGH PRIORITY – do it first`,open:`data-act="open-card" data-c="${esc(c.id)}"`});
      if(h.t==="reassign"&&h.to===S.me)out.push({mine:true,at:h.at,icon:"↩",text:`${nm(h.by)} sent “${c.title}” back to you – ${REASONS[h.reason]?REASONS[h.reason].label:""}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});
      if(h.t==="move"&&c.assigner===S.me&&(h.to==="int"||h.to==="done"))out.push({mine:true,at:h.at,icon:"✅",text:isAutoMove(h)?`“${c.title}” moved automatically to ${colOf(c.board,h.to).name}`:`${nm(h.by)} moved your card “${c.title}” to ${colOf(c.board,h.to).name}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});}
  }
  for(const x of Object.values(S.comments)){if(x.by===S.me)continue;const tg=S.cards[x.card]||S.messages[x.card]||S.docs[x.card];if(!tg){if(re&&re.test(x.text||""))out.push({at:x.at,icon:"@",text:`${nm(x.by)} mentioned you in a comment: ${(x.text||"").slice(0,90)}`});continue;}
    const involved=tg.by===S.me||tg.assigner===S.me||(tg.subs||[]).some(s=>s.a===S.me);const ment=re&&re.test(x.text);
    if(ment||involved)out.push({at:x.at,icon:ment?"@":"💬",text:`${nm(x.by)} ${ment?"mentioned you":"commented"} on “${tg.title}”: ${x.text.slice(0,90)}`,open:S.cards[x.card]?`data-act="open-card" data-c="${esc(x.card)}"`:S.messages[x.card]?`data-act="open-post" data-id="${esc(x.card)}"`:"",href:S.docs[x.card]?"#doc-"+x.card:""});}
  if(re){for(const m of Object.values(S.messages))if(m.by!==S.me&&re.test(m.body||""))out.push({at:m.at,icon:"@",text:`${nm(m.by)} mentioned you in “${m.title}”`,open:`data-act="open-post" data-id="${esc(m.id)}"`});
    for(const l of Object.values(S.chat))if(!l.dm&&l.by!==S.me&&re.test(l.text||""))out.push({at:l.at,icon:"@",text:`${nm(l.by)} mentioned you in chat: ${l.text.slice(0,90)}`,href:"#chat-"+l.client});}
  if(re){const seeC=c=>!c||canSeeClient(c);const cn=c=>c&&S.clients[c]?" · "+S.clients[c].name:"";
    for(const c of Object.values(S.cards)){if(!seeC(c.client))continue;const who=c.assigner||c.by;
      if(who!==S.me&&re.test(c.brief||""))out.push({at:c.created||c.at||0,icon:"@",text:`${nm(who)} mentioned you in the brief of “${c.title}”${cn(c.client)}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});
      for(const sb of c.subs||[])if(sb.by!==S.me&&re.test((sb.note||"")+" "+(sb.title||"")))out.push({at:sb.at||c.created||0,icon:"@",text:`${nm(sb.by||who)} mentioned you in a subtask on “${c.title}”${cn(c.client)}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});
      for(const h of c.hist||[])if(h.by!==S.me&&h.note&&re.test(h.note))out.push({at:h.at,icon:"@",text:`${nm(h.by)} mentioned you on “${c.title}”: ${h.note.slice(0,90)}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});}
    for(const d of Object.values(S.docs))if(d.by!==S.me&&seeC(d.client)&&re.test((d.body||"").replace(/<[^>]+>/g," ")))out.push({at:d.edited||d.at||0,icon:"@",text:`${nm(d.by)} mentioned you in the doc “${d.title}”${cn(d.client)}`,href:"#doc-"+d.id});
    for(const t of Object.values(S.todos))if(t.by!==S.me&&seeC(t.client)&&re.test((t.title||"")+" "+(t.notes||"")))out.push({at:t.created||0,icon:"@",text:`${nm(t.by)} mentioned you in a to-do: ${t.title}${cn(t.client)}`,href:"#todos-"+t.client});
    for(const e of Object.values(S.events))if(e.by!==S.me&&seeC(e.client)&&re.test((e.title||"")+" "+(e.notes||"")))out.push({at:e.at||0,icon:"@",text:`${nm(e.by)} mentioned you in the event “${e.title}” on ${fmtDay(e.date)}${cn(e.client)}`,href:"#calendar-"+e.client});
    for(const a of Object.values(S.answers))if(a.by!==S.me&&seeC(a.client)&&re.test(a.text||""))out.push({at:a.at||0,icon:"@",text:`${nm(a.by)} mentioned you in a check-in answer${cn(a.client)}: ${(a.text||"").slice(0,90)}`,href:"#checkins-"+a.client});}
  for(const x of Object.values(S.comments||{})){if(!x.rcard||x.by===S.me)continue;const c=S.cards[x.rcard];if(!c)continue;const sb=(c.subs||[]).find(y=>y.id===x.sub);const forMe=(sb&&sb.a===S.me)||c.assigner===S.me;if(!forMe)continue;out.push({mine:true,at:x.at||0,icon:x.vote==="ok"?"👍":"💡",text:x.vote==="ok"?`${nm(x.by)} says ${sb&&sb.a===S.me?"your work on ":""}“${c.title}” looks good`:`${nm(x.by)} left a review suggestion on “${c.title}”: ${(x.text||"").slice(0,90)}`,open:`data-act="open-card" data-c="${esc(c.id)}"`});}
  {const td=today();const tm=dayShift(td,1);if(speakerOn(td)===S.me)out.push({mine:true,sticky:true,at:new Date(td+"T00:00:00").getTime(),icon:"🎤",text:"You're giving today's education speech. All the best!",href:"#nanma-cal"});
   else if(speakerOn(tm)===S.me)out.push({mine:true,sticky:true,at:new Date(td+"T00:00:00").getTime(),icon:"🎤",text:`Tomorrow (${fmtDay(tm)}) is your turn for the education speech`,href:"#nanma-cal"});
   for(const [d,e] of Object.entries(ncDays()))if(e.at&&d>=td&&Date.now()-e.at<45*86400000&&(e.type==="holiday"||e.type==="half")&&e.by!==S.me)out.push({mine:true,at:e.at,icon:"📅",text:`${nm(e.by)} announced ${e.type==="holiday"?"a holiday":"a half day"}: ${e.name||dayLabel(e)} on ${fmtDay(d)}${e.note?" – "+e.note:""}`,href:"#nanma-cal"});}
  for(const u of Object.keys(S.logs))for(const q of reqsOf(u)){const c=S.cards[q.c];const sb=c&&findSub(q.c,q.s);if(!c)continue;
    if(q.st==="pending"&&u!==S.me&&canSubs()&&(c.assigner===S.me||isHR()||role(S.me)==="head"))out.push({mine:c.assigner===S.me,at:q.at,icon:"⏱",text:`${nm(u)} asked for ${fmtMin(q.min)} more on “${sb?subName(sb):""} – ${c.title}”: ${q.why||""}`,open:`data-act="open-card" data-c="${esc(c.id)}"`,sticky:true});
    if(u===S.me&&q.st!=="pending"&&q.by)out.push({mine:true,at:q.dat||q.at,icon:q.st==="ok"?"✅":"✖",text:`${nm(q.by)} ${q.st==="ok"?"approved":"declined"} your request for ${fmtMin(q.min)} more on “${c.title}”`,open:`data-act="open-card" data-c="${esc(c.id)}"`});}
  for(const x of Object.values(S.ccal||{})){if(x.kind!=="month"||!canSeeClient(x.client))continue;const cn=(S.clients[x.client]||{}).name||"";const lnk="#content-"+x.client;

    push("Events",Object.values(S.events).filter(e=>canSeeClient(e.client)&&hit(e.title+" "+(e.notes||""))).map(e=>({title:e.title,sub:fmtDay(e.date)+" · "+(S.clients[e.client]||{}).name,href:"#calendar-"+e.client})));

/* ---------- @mention picker in rich comment boxes ---------- */
let mnt=null;/* {id, node, start, q, list, i} */
function mentionPeople(q){q=(q||"").toLowerCase();const ms=members();return Object.keys(ms).map(u=>({u,name:ms[u].name||nm(u)})).filter(p=>p.name&&p.u!==S.me&&(!q||p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q))||p.name.toLowerCase().startsWith(q))).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8);}
function mentionClose(){mnt=null;const b=document.getElementById("mention-box");if(b)b.remove();}
function mentionCheck(ed){
  const sel=document.getSelection();if(!sel||!sel.rangeCount||!sel.isCollapsed){mentionClose();return;}
  const r=sel.getRangeAt(0);const node=r.startContainer;if(node.nodeType!==3||!ed.contains(node)){mentionClose();return;}
  const before=node.textContent.slice(0,r.startOffset);const m=before.match(/(^|[\s (])@([A-Za-z][\w.'-]{0,30}(?: [A-Za-z][\w.'-]{0,30})?)?$/);
  if(!m){mentionClose();return;}
  const q=m[2]||"";const list=mentionPeople(q);if(!list.length){mentionClose();return;}
  mnt={id:ed.dataset.rte,node,start:r.startOffset-q.length-1,end:r.startOffset,q,list,i:mnt&&mnt.q===q?Math.min(mnt.i,list.length-1):0};
  mentionDraw(r);
}
function mentionDraw(range){
  let b=document.getElementById("mention-box");if(!b){b=document.createElement("div");b.id="mention-box";b.setAttribute("role","listbox");b.setAttribute("aria-label","Mention someone");document.body.appendChild(b);}
  b.innerHTML=mnt.list.map((p,k)=>`<button type="button" role="option" aria-selected="${k===mnt.i}" class="mention-opt${k===mnt.i?" on":""}" data-mu="${esc(p.u)}">${avRaw(p.u,24)}<span>${esc(p.name)}</span></button>`).join("");
  const rc=(range||document.getSelection().getRangeAt(0)).getBoundingClientRect();const ed=document.getElementById("rte-"+mnt.id);const er=ed.getBoundingClientRect();
  const top=(rc.bottom||er.top+24)+6,left=Math.min(rc.left||er.left+12,window.innerWidth-260);
  b.style.top=Math.min(top,window.innerHeight-b.offsetHeight-8)+"px";b.style.left=Math.max(8,left)+"px";
}
function mentionPick(u){
  if(!mnt)return;const p=mnt.list.find(x=>x.u===u);if(!p){mentionClose();return;}
  const {id,node,start,end}=mnt;const ed=document.getElementById("rte-"+id);mentionClose();
  if(!ed||!ed.contains(node))return;
  const r=document.createRange();r.setStart(node,Math.max(0,start));r.setEnd(node,Math.min(end,node.textContent.length));
  const sel=document.getSelection();sel.removeAllRanges();sel.addRange(r);ed.focus();
  document.execCommand("insertHTML",false,`<span class="mention">@${esc(p.name)}</span>&nbsp;`);rteSave(id);
}
document.addEventListener("input",e=>{const ed=e.target.closest&&e.target.closest("[data-rte]");if(ed)mentionCheck(ed);});
document.addEventListener("keydown",e=>{if(!mnt)return;const ed=e.target.closest&&e.target.closest("[data-rte]");if(!ed)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();mnt.i=(mnt.i+(e.key==="ArrowDown"?1:mnt.list.length-1))%mnt.list.length;mentionDraw();}
  else if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();mentionPick(mnt.list[mnt.i].u);}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();mentionClose();}},true);
document.addEventListener("mousedown",e=>{const o=e.target.closest&&e.target.closest(".mention-opt");if(o){e.preventDefault();mentionPick(o.dataset.mu);}else if(!(e.target.closest&&e.target.closest("[data-rte]")))mentionClose();});
window.addEventListener("scroll",()=>{if(mnt)mentionClose();},true);

/* ================= Content Calendar ================= */
const CC_PLATFORMS=["Instagram","Facebook","LinkedIn","YouTube","X (Twitter)","Pinterest","Threads","WhatsApp","Website / Blog","Google Business","Other"];
const CC_FMT_ICON={Static:"🖼",Carousel:"🎠",Reel:"🎬",Video:"📹","Concept video":"📹",Other:"📝"};
const CC_STATUS={draft:["Draft","#586476","#F0F0F0"],review:["Waiting for team approval","#A35B00","#FFF4E0"],changes:["Changes requested by team","#B4282D","#FDECEC"],teamok:["Team approved – send to client","#000000","#F0F0F0"],client:["Waiting for client approval","#FF0000","#FFE5E5"],clientchanges:["Client requested changes","#B4282D","#FDECEC"],approved:["Client approved – tasks assigned","#16794A","#E6F6EC"]};
const CC_STEP={draft:0,changes:0,review:1,teamok:2,clientchanges:2,client:2,approved:3};
function ccStepper(st){const n=CC_STEP[st]||0;const steps=["Plan","Team approval","Client approval","Tasks assigned"];return `<ol class="ccsteps" aria-label="Approval progress">${steps.map((l,i)=>`<li class="${i<n||st==="approved"?"done":i===n?"on":""}" ${i===n&&st!=="approved"?'aria-current="step"':""}><span>${i<n||st==="approved"?"✓":i+1}</span>${l}</li>`).join("")}</ol>`;}
const ccId=(cid,ym)=>"mo_"+cid+"_"+ym;
const ymName=ym=>new Date(ym+"-01T00:00:00").toLocaleString("en-IN",{month:"long",year:"numeric"});
const ymShift=(ym,n)=>{const d=new Date(ym+"-01T00:00:00");d.setMonth(d.getMonth()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const dayShift=(day,n)=>{const d=new Date(day+"T00:00:00");d.setDate(d.getDate()+n);return dayOf(d.getTime());};
function ccMonthOf(cid){S.ccMonth=S.ccMonth||{};return S.ccMonth[cid]||thisMonth();}
function ccMonthDoc(cid,ym){return S.ccal[ccId(cid,ym)]||{kind:"month",client:cid,month:ym,status:"draft",hist:[]};}
function ccPosts(cid,ym){return Object.values(S.ccal).filter(x=>x.kind==="post"&&x.client===cid&&x.month===ym).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.at||0)-(b.at||0));}
function ccBoards(cid){return Object.values(S.boards).filter(b=>b.client===cid&&canSeeBoard(b.id)).sort((a,b)=>(a.at||a.created||0)-(b.at||b.created||0));}
const CC_SVC_RE={sm:/social/i,pm:/perform|paid|\bads?\b|meta ads|google ads/i};
function ccBoardFor(cid,ym,svc){svc=svc||"sm";const md=ccMonthDoc(cid,ym);const bs=ccBoards(cid);const pick=md.boards&&md.boards[svc];if(pick&&S.boards[pick])return pick;
  const re=CC_SVC_RE[svc];const byName=re&&bs.find(b=>re.test(b.name||"")&&!b.restricted);if(byName)return byName.id;
  if(md.board&&S.boards[md.board])return md.board;const pub=bs.find(b=>!b.restricted);return (pub||bs[0]||{}).id||"";}
function ccSvcsShown(cid,posts){const c=S.clients[cid]||{};const l=c.svcList||[];const d=c.dlv||{};return [...DLV.filter(([k,lab])=>l.includes(lab)||posts.some(p=>(p.svc||"sm")===k)||Object.values(d[k]||{}).some(v=>v!=null)),...(posts.some(p=>p.svc==="other")?[["other","Other"]]:[])].concat(l.length||posts.length?[]:[DLV[0]]);}
const ccEditable=st=>(canSubs()&&["draft","changes","clientchanges"].includes(st))||(canCards()&&st==="review");
function ccGuess(bid,stage){const ppl=boardPeople(bid);const words={writer:/writ|content|copy/i,designer:/design|graphic/i,editor:/edit|video|motion/i,production:/produc|shoot|camera|cinema/i}[stage];if(!words)return"";const hit=ppl.find(u=>words.test(desig(u)));return hit||"";}
function ccSteps(format,bid,date,keep){const wc=workCols(bid).map(x=>x.id);const pre=PRESETS[format]||PRESETS.Other;const n=pre.length;
  return pre.map(([name,st,mn],i)=>{const stage=wc.includes(st)?st:wc[0];const old=(keep||[]).find(k=>k.stage===stage);return {id:rid(),name,stage,a:old?old.a:ccGuess(bid,stage),day:date?dayShift(date,-(n-i)-1):"",min:mn};});}
function ccSave(md){const id=ccId(md.client,md.month);const o=clone(md);delete o.id;write("ccal/"+id,o);S.ccal[id]=Object.assign({id},o);}
function ccHist(md,ev){md.hist=(md.hist||[]).slice(0,40);md.hist.unshift(Object.assign({at:Date.now(),by:S.me},ev));}

function ccTileBody(cid){const ym=thisMonth();const md=ccMonthDoc(cid,ym);const ps=ccPosts(cid,ym);const nx=ymShift(ym,1);const mdn=ccMonthDoc(cid,nx);const pn=ccPosts(cid,nx);
  const line=(y,m,p)=>{const st=CC_STATUS[m.status]||CC_STATUS.draft;return `<div class="item" style="padding:7px 0"><span class="small" style="width:120px;flex:none;font-weight:700">${esc(ymName(y))}</span><span class="small">${p.length} post${p.length===1?"":"s"}</span><span class="chip" style="margin-left:auto;background:${st[2]};color:${st[1]}">${st[0]}</span></div>`;};
  return line(ym,md,ps)+line(nx,mdn,pn);}

function ccDefaultSvc(cid){const l=(S.clients[cid]||{}).svcList||[];return l.includes("Social Media")||!l.includes("Performance Marketing")?"sm":"pm";}
function ccDelivPanel(cid,posts,ym){const c=S.clients[cid]||{};const d=c.dlv||{};let ok=0,bad=0,any=false;
  const cell=(k,t)=>{const promised=dlvNum((d[k]||{})[t]);const planned=posts.filter(p=>(p.svc||"sm")===k&&fmtBucket(p.format)===t).length;
    if(promised==null)return `<td><span class="muted">N/A</span>${planned?` <span class="xs muted">· ${planned} planned</span>`:""}</td>`;any=true;
    const diff=planned-promised;diff===0?ok++:bad++;
    return `<td><strong style="font-size:17px">${planned}</strong> <span class="muted">/ ${promised}</span> ${diff===0?`<span class="chip good">✓ Matches</span>`:diff<0?`<span class="chip bad">${-diff} short</span>`:`<span class="chip" style="background:#FFF4E0;color:#A35B00">${diff} extra</span>`}</td>`;};
  const rows=DLV.map(([k,l])=>`<tr><td><strong>${l}</strong></td>${DLV_TYPES.map(([t])=>cell(k,t)).join("")}</tr>`).join("");
  const others=posts.filter(p=>fmtBucket(p.format)==="other"||(p.svc&&!DLV.some(([k])=>k===p.svc))).length;
  const extra=(c.deliverables||[]).filter(x=>x.item);
  return `<section class="panel" style="padding:14px 18px"><div class="between" style="flex-wrap:wrap;gap:8px"><h2 class="h2" style="font-size:17px">Deliverables check – ${esc(ymName(ym))}</h2>${any?(bad?`<span class="chip bad">Doesn't match what we promised yet</span>`:`<span class="chip good">✓ Matches what we promised</span>`):""}</div>
   <div class="tablewrap"><table><thead><tr><th>Service</th>${DLV_TYPES.map(([t,l])=>`<th>${l} <span class="muted" style="font-weight:400">planned / promised</span></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
   <p class="xs muted" style="margin:0">From the client's onboarding details. Carousels count as static, reels as video.${others?` ${others} post${others>1?"s are":" is"} “Other” and not counted.`:""}${!any?` No creative numbers have been entered for this client yet${canPeople()?` – add them in <button class="linkbtn xs" data-act="edit-client" data-id="${esc(cid)}">client details</button>`:" – ask HR or a department head to add them"}.`:""}</p>
   ${extra.length?`<p class="small" style="margin:0"><strong>Other deliverables:</strong> ${extra.map(x=>`${esc(x.count||"")} ${esc(x.item)}`).join(" · ")}</p>`:""}</section>`;}
function viewContent(cid){
  const c=S.clients[cid];if(!c)return `<div class="wrap"><p>Loading…</p></div>`;
  if(!canSeeClient(cid))return `<div class="wrap"><div class="panel"><p>You don't have access to this client.</p></div></div>`;
  const ym=ccMonthOf(cid);const md=ccMonthDoc(cid,ym);const st=md.status||"draft";const S_=CC_STATUS[st]||CC_STATUS.draft;
  const posts=ccPosts(cid,ym);const bid=ccBoardFor(cid,ym);const ed=ccEditable(st);const boards=ccBoards(cid);
  const byFmt={};posts.forEach(p=>byFmt[p.format]=(byFmt[p.format]||0)+1);
  const missing=posts.filter(p=>(p.steps||[]).some(s=>!s.a)).length;
  /* month grid, weeks start Monday */
  const first=new Date(ym+"-01T00:00:00");const lead=(first.getDay()+6)%7;const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const cells=[];for(let i=0;i<lead;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(ym+"-"+String(d).padStart(2,"0"));while(cells.length%7)cells.push(null);
  const td=today();
  const grid=`<div class="ccgrid" role="grid" aria-label="${esc(ymName(ym))}">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<div class="cchd" role="columnheader">${w}</div>`).join("")}${cells.map(day=>{if(!day)return `<div class="cccell off"></div>`;const ps=posts.filter(p=>p.date===day);
    return `<div class="cccell${day===td?" today":""}" role="gridcell"><div class="between"><span class="ccnum">${Number(day.slice(8))}</span>${ed?`<button class="ccadd" data-act="cc-new" data-client="${esc(cid)}" data-day="${day}" aria-label="Add a post on ${fmtDay(day)}" title="Add a post">+</button>`:""}</div>${ps.map(p=>{const card=p.card&&S.cards[p.card];return `<button class="ccchip${(p.steps||[]).some(s=>!s.a)?" warn":""}" data-act="cc-open" data-id="${esc(p.id)}" title="${esc(p.platform+" · "+p.format+" – "+p.topic)}">${CC_FMT_ICON[p.format]||"📝"} <span>${esc(p.topic)}</span>${card?`<span class="ccdone" style="background:${esc(colOf(card.board,card.col).color)}" title="${esc(colOf(card.board,card.col).name)}"></span>`:""}</button>`;}).join("")}</div>`;}).join("")}</div>`;
  const list=posts.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>Date</th><th>Service</th><th>Platform</th><th>Format</th><th>Topic</th><th>Team</th><th>${st==="approved"||posts.some(p=>p.card)?"Card":""}</th></tr></thead><tbody>${posts.map(p=>{const card=p.card&&S.cards[p.card];return `<tr><td style="white-space:nowrap">${fmtDay(p.date)}</td><td class="small">${esc(((DLV.find(([k])=>k===(p.svc||"sm"))||[0,"Other"])[1]))}</td><td>${esc(p.platform)}</td><td>${CC_FMT_ICON[p.format]||""} ${esc(p.format)}</td><td><button class="linkbtn" style="font-weight:700;text-align:left" data-act="cc-open" data-id="${esc(p.id)}">${esc(p.topic)}</button>${p.brief?`<div class="muted xs">${esc(p.brief.slice(0,120))}${p.brief.length>120?"…":""}</div>`:""}</td><td>${(p.steps||[]).map(s=>`<div class="xs" style="white-space:nowrap">${esc(s.name)}: ${s.a?esc(nm(s.a)):`<span style="color:var(--bad);font-weight:700">not chosen</span>`}</div>`).join("")}</td><td>${card?`<button class="btn sm ghost" data-act="open-card" data-c="${esc(card.id)}">${esc(colOf(card.board,card.col).name)}</button>`:p.card?`<span class="muted xs">Card removed</span>`:""}</td></tr>`;}).join("")}</tbody></table></div>`:`<p class="muted">No posts planned for ${esc(ymName(ym))} yet.${ed?" Click <strong>+ Add post</strong> or the + on any day.":""}</p>`;
  const last=(md.hist||[])[0];
  const open=posts.filter(p=>!p.card||!S.cards[p.card]).length;const cbtn=(act,label,style)=>`<button class="btn${style?" "+style:""}" data-act="${act}" data-client="${esc(cid)}">${label}</button>`;
  const actions=S.ccConfirm===cid+ym?`<span class="small" style="font-weight:700">Client approved? This creates and assigns ${(()=>{const c={};posts.filter(p=>!p.card||!S.cards[p.card]).forEach(p=>{const b=ccBoardFor(cid,ym,p.svc||"sm");c[b]=(c[b]||0)+1;});return Object.entries(c).map(([b,k])=>`${k} card${k>1?"s":""} on “${esc((S.boards[b]||{}).name||"")}”`).join(" and ");})()}.</span>${cbtn("cc-approve","Yes, assign tasks","green")}<button class="btn ghost" data-act="cc-cancel">Cancel</button>`:[
    ed?cbtn("cc-new","+ Add post"):"",
    canSubs()&&["draft","changes","clientchanges"].includes(st)&&posts.length?cbtn("cc-send","Send for team approval"):"",
    canCards()&&st==="review"?cbtn("cc-teamok","✓ Team approve","green"):"",
    canCards()&&st==="review"?cbtn("cc-back","Send back","ghost"):"",
    canSubs()&&["teamok","clientchanges"].includes(st)?cbtn("cc-toclient",st==="clientchanges"?"Send to client again":"Send to client"):"",
    canSubs()&&st==="client"?cbtn("cc-clientcopy","Client copy","ghost"):"",
    canSubs()&&st==="client"?cbtn("cc-clientok","✓ Client approved","green"):"",
    canSubs()&&st==="client"?cbtn("cc-clientback","Client wants changes","ghost"):"",
    canCards()&&st==="approved"?cbtn("cc-reopen","Reopen to add posts","ghost"):""].join("");
  return `<div class="wrap">${clientHeader(c,cid,"Content Calendar")}
  <div class="between"><h1 class="h1">Content Calendar</h1><div class="row">${actions}</div></div>
  <section class="panel" style="padding:14px 18px"><div class="between" style="flex-wrap:wrap;gap:10px">
   <div class="row" style="gap:6px"><button class="btn sm ghost" data-act="cc-month" data-client="${esc(cid)}" data-n="-1" aria-label="Previous month">‹</button><h2 class="h2" style="min-width:170px;text-align:center">${esc(ymName(ym))}</h2><button class="btn sm ghost" data-act="cc-month" data-client="${esc(cid)}" data-n="1" aria-label="Next month">›</button>${ym!==thisMonth()?`<button class="linkbtn small" data-act="cc-month" data-client="${esc(cid)}" data-n="0">This month</button>`:""}</div>
   <span class="chip" style="background:${S_[2]};color:${S_[1]};font-weight:700">${S_[0]}</span></div>
   <div class="row" style="flex-wrap:wrap;gap:14px;margin-top:8px">
    ${ccSvcsShown(cid,posts).map(([k,lab])=>{const sel=ccBoardFor(cid,ym,k);return `<label class="small row" style="gap:6px"><strong>${lab}</strong> posts go to <select data-act-change="cc-board" data-client="${esc(cid)}" data-svc="${k}" ${ed&&canSubs()?"":"disabled"} style="min-height:34px">${boards.length?boards.map(b=>`<option value="${esc(b.id)}" ${b.id===sel?"selected":""}>${esc(b.name)}</option>`).join(""):`<option value="">No card table yet</option>`}</select></label>`;}).join("")}
    <span class="small muted">${posts.length} post${posts.length===1?"":"s"}${Object.keys(byFmt).length?" · "+Object.entries(byFmt).map(([k,v])=>v+" "+k.toLowerCase()+(v>1&&!/s$/.test(k)?"s":"")).join(", "):""}</span>
    ${missing?`<span class="small" style="color:var(--bad);font-weight:700">${missing} post${missing>1?"s":""} still need people</span>`:""}</div>
   ${last?`<p class="small muted" style="margin:8px 0 0">${esc(nm(last.by))} ${({send:"sent this for team approval",teamok:"approved this for the team",back:"sent this back",toclient:"sent this to the client",clientback:"recorded changes requested by the client",approve:"recorded client approval and assigned "+(last.n||0)+" card(s)",reopen:"reopened this"})[last.t]||"updated this"} · ${fmtWhen(last.at)}</p>`:""}
   ${ccStepper(st)}
   ${st==="changes"&&md.note?`<div class="notice" style="margin-top:10px"><strong>Changes requested by ${esc(nm(md.backBy))}:</strong> ${esc(md.note)}</div>`:""}
   ${st==="clientchanges"&&md.clientNote?`<div class="notice" style="margin-top:10px"><strong>The client asked for changes</strong> (recorded by ${esc(nm(md.clientBackBy))}): ${esc(md.clientNote)}<br><span class="small">Edit the posts, then send it to the client again – or back to the team if the changes are big.</span></div>`:""}
   ${st==="review"&&canCards()?`<div class="notice" style="margin-top:10px">Review the posts below. <strong>Team approve</strong> lets the manager or a department head send it to the client. Nothing is assigned until the client approves.</div>`:""}
   ${st==="teamok"?`<div class="notice" style="margin-top:10px">Approved by ${esc(nm(md.teamBy))}. ${canSubs()?"Press <strong>Send to client</strong> to get a client copy to share on WhatsApp or email.":"Waiting for the manager or a department head to send it to the client."}</div>`:""}
   ${st==="client"?`<div class="notice" style="margin-top:10px">Sent to the client by ${esc(nm(md.clientSentBy))} · ${fmtWhen(md.clientSentAt)}. ${canSubs()?"When the client replies, the manager or a department head presses <strong>✓ Client approved</strong> to assign the tasks, or <strong>Client wants changes</strong>.":"Waiting for the client – a manager or department head records their reply."}</div>`:""}
  </section>
  ${S.admin?ccDelivPanel(cid,posts,ym):""}
  <section class="panel">${grid}</section>
  <section class="panel"><h2 class="h2">All posts this month</h2>${list}</section></div>`;
}

  return `<form class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="cch" data-form="ccpost"><div class="between"><h2 id="cch" class="h2">${m.edit?(ro?"Post":"Edit post"):"New post"} – ${esc(ymName(f.month))}</h2><button type="button" class="btn sm ghost" data-act="close" aria-label="Close">✕</button></div>
  <fieldset ${ro?"disabled":""} style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">

   <label class="field">Post date<input type="date" data-f="date" value="${esc(f.date||"")}" min="${f.month}-01" max="${f.month}-${String(new Date(Number(f.month.slice(0,4)),Number(f.month.slice(5)),0).getDate()).padStart(2,"0")}" required data-act-change="cc-date"></label>

   <label class="field">Format<select data-f="format" data-act-change="cc-format">${FORMATS.map(x=>`<option ${f.format===x?"selected":""}>${x}</option>`).join("")}</select></label></div>

function ccApprove(cid){const ym=ccMonthOf(cid);if(ccMonthDoc(cid,ym).status!=="client"){toast("Send it to the client first.");return;}const posts=ccPosts(cid,ym).filter(p=>!p.card||!S.cards[p.card]);

const LOCK_IDLE=30*60*1000;
const lockOf=u=>(S.logs[u]||{}).lock||null;
const loginCred=u=>S.creds["login_"+u]||null;
const randHex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function hashPw(pw,salt){const enc=new TextEncoder();const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:150000},key,256);return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");}
function genPw(){const w="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";const r=crypto.getRandomValues(new Uint8Array(8));return [...r].map(x=>w[x%w.length]).join("");}
function suggestUser(name){return (name||"").toLowerCase().trim().replace(/\s+/g,".").replace(/[^a-z0-9._-]/g,"").slice(0,30)||"user";}
let unlockMem=null;
const unlockKey=()=>"nanma_unlock_"+S.me;
const unlockTok=()=>{const l=lockOf(S.me);return l?S.me+":"+String(l.h).slice(0,24):null;};
const stayKey=()=>"nanma_stay_"+S.me;
function stayOn(){const t=unlockTok();if(!t)return false;try{const o=JSON.parse(localStorage.getItem(stayKey())||"null");return !!(o&&o.t===t&&o.day===today());}catch(_){return false;}}
function setStay(on){try{if(on)localStorage.setItem(stayKey(),JSON.stringify({t:unlockTok(),day:today()}));else localStorage.removeItem(stayKey());}catch(_){}}
function stayRec(){try{return JSON.parse(localStorage.getItem(stayKey())||"null");}catch(_){return null;}}
function isUnlocked(){const t=unlockTok();if(!t)return true;const so=stayRec();if(so&&so.t===t)return so.day===today();let v=unlockMem;try{v=sessionStorage.getItem(unlockKey())||v;}catch(_){}return v===t;}
function setUnlocked(on){const t=on?unlockTok():null;unlockMem=t;try{if(t)sessionStorage.setItem(unlockKey(),t);else sessionStorage.removeItem(unlockKey());}catch(_){}setStay(false);}

async function loginSubmit(form){
  const l=lockOf(S.me);if(!l)return;const err=form.querySelector("#lg-err");
  const u=(form.querySelector("#lg-u").value||"").trim().toLowerCase();const p=form.querySelector("#lg-p").value||"";
  if(S.loginWait&&Date.now()<S.loginWait){err.textContent=`Too many wrong tries. Wait ${Math.ceil((S.loginWait-Date.now())/1000)} seconds.`;return;}
  err.textContent="Checking…";
  let h="";try{h=await hashPw(p,l.s);}catch(e){err.textContent="This browser can't check passwords here.";return;}
  if(u===l.u&&h===l.h){S.loginFails=0;setUnlocked(true);const st=form.querySelector("#lg-stay");if(st&&st.checked)setStay(true);lastAct=Date.now();logAct("signed in to the CRM",null);const el=document.getElementById("main");delete el.dataset.gate;renderAll();toast("Welcome, "+nm(S.me).split(" ")[0]+"!");return;}
  S.loginFails=(S.loginFails||0)+1;if(S.loginFails>=5){S.loginWait=Date.now()+60000;S.loginFails=0;}
  const other=u&&u!==l.u&&Object.values(S.logs).some(x=>x&&x.lock&&x.lock.u===u);
  err.textContent=other?`“${u}” is another employee's username. This computer is signed in as ${nm(S.me)} – use your own login.`:"Wrong username or password.";
  form.querySelector("#lg-p").value="";form.querySelector("#lg-p").focus();
  if(other)logAct(`tried to sign in with another employee's username (${u}) on ${nm(S.me)}'s account`,null);
}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function encPw(pw){const pub=S.team&&S.team.pwPub;if(!pub)return null;const k=await crypto.subtle.importKey("jwk",pub,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);return b64(await crypto.subtle.encrypt({name:"RSA-OAEP"},k,new TextEncoder().encode(pw)));}
let privKeyP=null,privKeyFor=null;
async function decPw(enc){const c=S.creds.login_key;if(!c||!c.priv)return null;if(privKeyFor!==c){privKeyFor=c;privKeyP=crypto.subtle.importKey("jwk",c.priv,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);}const k=await privKeyP;return new TextDecoder().decode(await crypto.subtle.decrypt({name:"RSA-OAEP"},k,unb64(enc)));}
async function ensurePwKey(){
  if(S.pwKeyBusy||!isHR()||!S.editor||!S.credsReady||!S.ready.team)return;
  if(S.team&&S.team.pwPub)return;

  try{const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
    const pub=await crypto.subtle.exportKey("jwk",kp.publicKey),priv=await crypto.subtle.exportKey("jwk",kp.privateKey);
    write("leads/login_key",{kind:"key",priv,at:Date.now(),by:S.me});S.creds.login_key={id:"login_key",priv};
    const tm=clone(S.team||{});delete tm.id;tm.pwPub=pub;write("crm/team",tm);S.team=tm;}catch(e){}
  S.pwKeyBusy=false;renderMain();
}

  const c=loginCred(u);return c&&c.u===l.u?c.p:null;}

/* ================= 7-hour day, extra-time requests, efficiency ================= */
const DAY_CAP=420;                 /* minutes of allotted work per person per day */
const EXTRA_LOCK=15*60000;         /* no requests in the last 15 minutes */
const isWorkDay=d=>isOpenDay(d);   /* working or half day on the Nanma calendar */
function dayLoad(uid,day,exclude,pending){let m=0;for(const c of Object.values(S.cards)){if(c.col==="notnow")continue;for(const s of c.subs||[])if(s.a===uid&&s.day===day&&!(exclude&&exclude.has(s.id)))m+=Number(s.min)||0;}return m+((pending&&pending[uid+"|"+day])||0);}
function nextFreeDay(uid,need,from,exclude,pending){let d=from;for(let i=0;i<120;i++){if(isWorkDay(d)&&dayLoad(uid,d,exclude,pending)+need<=dayCap(d))return d;d=dayShift(d,1);}return null;}
function capIssues(items,exclude){const add={};for(const it of items){if(!it.a||!it.day)continue;const k=it.a+"|"+it.day;add[k]=(add[k]||0)+(Number(it.min)||0);}
  const out=[];for(const k in add){const [u,d]=k.split("|");const lv=onLeave(u,d);if(lv){out.push(`${nm(u)} is on ${lv<1?"half-day ":""}leave on ${fmtDay(d)}.`);if(lv>=1)continue;}const have=dayLoad(u,d,exclude);if(have+add[k]>dayCap(d)){const nf=nextFreeDay(u,add[k],dayShift(d,1),exclude);out.push(`${nm(u)} already has ${fmtMin(have)} booked on ${fmtDay(d)} – adding ${fmtMin(add[k])} goes over the ${dayCap(d)<DAY_CAP?"half day ("+fmtMin(dayCap(d))+")":"7-hour day"}.${nf?` Next day with room: ${fmtDay(nf)}.`:""}`);}}return out;}
function loadHint(uid,day,exclude,extra){if(!uid||!day)return"";const lv=onLeave(uid,day);if(lv)return `<span class="xs" style="color:var(--bad);font-weight:700">🌴 ${esc(nm(uid).split(" ")[0])} is on ${lv<1?"half-day ":""}leave on ${fmtDay(day)}</span>`;const have=dayLoad(uid,day,exclude)+(extra||0);const cap=dayCap(day);const left=cap-have;return `<span class="xs" style="color:${left<0?"var(--bad)":left<60?"#A35B00":"var(--muted)"}">${esc(nm(uid).split(" ")[0])}: ${fmtMin(Math.max(0,have))} of ${fmtMin(cap)} booked on ${fmtDay(day)}${left<0?` – ${fmtMin(-left)} over`:` · ${fmtMin(left)} free`}${isWorkDay(day)?(cap<DAY_CAP?" · half day":""):" · "+esc(dayLabel(dayInfo(day)))}</span>`;}

/* --- extra-time requests: stored in the worker's own timelog record --- */
const reqsOf=u=>((S.logs[u]||{}).req||[]);
const reqFor=(sub,cid)=>reqsOf(sub.a).filter(q=>q.c===cid&&q.s===sub.id);
const pendingReq=(sub,cid)=>reqFor(sub,cid).find(q=>q.st==="pending")||null;
function remainingMs(sub,cid){return (Number(sub.min)||0)*60000-usedMs(sub,cid);}
function extraLocked(sub,cid){return remainingMs(sub,cid)<=EXTRA_LOCK;}
function reqBtn(sub,cid,size){if(!Number(sub.min))return "";const p=pendingReq(sub,cid);if(p)return `<button class="btn ${size} ghost" disabled title="Waiting for a manager or head">⏳ ${fmtMin(p.min)} requested</button>`;
  const lock=extraLocked(sub,cid);return `<button class="btn ${size} ghost" data-act="req-extra" data-c="${esc(cid)}" data-s="${esc(sub.id)}" ${lock?"disabled":""} title="${lock?"Requests close in the last 15 minutes of the allotted time":"Ask your manager for more time"}">+ Extra time</button>`;}

  const q={id:rid(),c:m.c,s:m.s,min:Number(m.f.min)||30,why:why.slice(0,500),at:Date.now(),st:"pending"};L.req.push(q);delete L.id;

  closeModal();toast("Request sent to your manager.");renderAll();}
function decideReq(uid,qid,ok){if(!canSubs())return;const L=clone(S.logs[uid]||{});delete L.id;const q=(L.req||[]).find(x=>x.id===qid);if(!q||q.st!=="pending"){toast("This request was already handled.");return;}
  const card=S.cards[q.c];const sub=card&&findSub(q.c,q.s);
  if(ok){if(!sub){toast("That subtask no longer exists.");return;}const c=clone(card);const s2=c.subs.find(x=>x.id===q.s);s2.min=(Number(s2.min)||0)+q.min;pushHist(c,{t:"extra",to:uid,sname:subName(s2),min:q.min,why:q.why});saveCard(c);
    const over=dayLoad(uid,s2.day)+q.min-DAY_CAP;

  else{logAct(`declined ${nm(uid)}'s request for ${fmtMin(q.min)} extra${card?" on “"+card.title+"”":""}`,card&&card.client,{card:q.c});toast("Request declined.");}
  q.st=ok?"ok":"no";q.by=S.me;q.dat=Date.now();write("timelogs/"+uid,L);S.logs[uid]=Object.assign({id:uid},L);renderAll();}

setInterval(()=>{document.querySelectorAll('[data-act="req-extra"]').forEach(b=>{const s=findSub(b.dataset.c,b.dataset.s);if(s&&extraLocked(s,b.dataset.c)&&!b.disabled){b.disabled=true;b.title="Requests close in the last 15 minutes of the allotted time";}});},15000);

/* --- daily efficiency --- */
function effDay(day){const ms=members();const rows={};
  for(const u in ms)rows[u]={u,name:ms[u].name||nm(u),dept:ms[u].dept||"",role:ms[u].role,booked:0,n:0,done:0,allotDone:0,usedDone:0,logged:0,xreq:0,xok:0};
  for(const c of Object.values(S.cards)){if(c.col==="notnow")continue;for(const s of c.subs||[]){if(s.day!==day||!rows[s.a])continue;const R=rows[s.a];R.booked+=Number(s.min)||0;R.n++;const r=rate(s,c.id);if(r.done||r.firstDone){R.done++;R.allotDone+=Number(s.min)||0;R.usedDone+=usedMs(s,c.id)/60000;}}}
  for(const u in rows){const L=logOf(u);for(const k in (L.logs||{}))for(const x of L.logs[k].s||[])if(dayOf(x[0])===day)rows[u].logged+=(x[1]-x[0])/60000;if(L.running&&dayOf(L.running.t)===day)rows[u].logged+=(Date.now()-L.running.t)/60000;
    for(const q of reqsOf(u))if(dayOf(q.at)===day){rows[u].xreq++;if(q.st==="ok")rows[u].xok+=q.min;}}
  return Object.values(rows).map(R=>Object.assign(R,{saved:R.allotDone-R.usedDone,eff:R.usedDone>0?R.allotDone/R.usedDone:null}));}
const fmtSigned=m=>{const v=Math.round(m);return (v>0?"+":v<0?"−":"")+fmtMin(Math.abs(v));};
function viewEfficiency(){
  if(!(isHR()||(S.admin&&role(S.me)==="head")))return `<div class="wrap"><div class="panel"><h1 class="h2">Efficiency</h1><p>Only HR, department heads and admins can see this page.</p></div></div>`;
  const day=S.effDay||today();const dept=S.effDept||"";
  let rows=effDay(day).filter(r=>r.role!=="hr"||r.n>0);if(dept)rows=rows.filter(r=>r.dept===dept);
  rows.sort((a,b)=>b.booked-a.booked||a.name.localeCompare(b.name));
  const T=rows.reduce((t,r)=>({booked:t.booked+r.booked,allot:t.allot+r.allotDone,used:t.used+r.usedDone,done:t.done+r.done,n:t.n+r.n}),{booked:0,allot:0,used:0,done:0,n:0});
  const saved=T.allot-T.used;const eff=T.used>0?Math.round(T.allot/T.used*100):null;
  /* last 6 working days */
  const days=[];let d=day;while(days.length<6){if(isWorkDay(d))days.unshift(d);d=dayShift(d,-1);}
  const trend=days.map(x=>{const rs=effDay(x).filter(r=>!dept||r.dept===dept);return{d:x,saved:rs.reduce((t,r)=>t+r.saved,0),done:rs.reduce((t,r)=>t+r.done,0)};});
  const mx=Math.max(30,...trend.map(t=>Math.abs(t.saved)));
  const W=1100,H=170,mid=H/2,bw=W/trend.length;
  const chart=`<svg viewBox="0 0 ${W} ${H+30}" width="100%" style="max-height:230px" role="img" aria-label="Time saved per day, last 6 working days"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#C9D1DD"/>${trend.map((t,i)=>{const h=Math.abs(t.saved)/mx*(mid-14);const y=t.saved>=0?mid-h:mid;const col=t.saved>=0?"#16794A":"#B4282D";return `<g>${t.done?`<rect x="${i*bw+bw*0.3}" y="${y}" width="${bw*0.4}" height="${Math.max(2,h)}" rx="4" fill="${col}"`:`<rect x="0" y="0" width="0" height="0"`}${t.d===day?' stroke="#000000" stroke-width="2"':""}><title>${fmtDay(t.d)}: ${fmtSigned(t.saved)} (${t.done} finished)</title></rect><text x="${i*bw+bw/2}" y="${t.done?(t.saved>=0?y-6:y+h+16):mid-6}" text-anchor="middle" font-size="14" fill="${col}" font-weight="700">${t.done?fmtSigned(t.saved):"–"}</text><text x="${i*bw+bw/2}" y="${H+22}" text-anchor="middle" font-size="13" fill="#586476">${esc(fmtDay(t.d).replace(/^\w+, /,""))}</text></g>`;}).join("")}</svg>`;
  const pend=[];for(const u of Object.keys(members()))for(const q of reqsOf(u))if(q.st==="pending"){const c=S.cards[q.c];const s=c&&findSub(q.c,q.s);if(s&&(!dept||(members()[u]||{}).dept===dept))pend.push([u,q,c,s]);}
  const bar=(m)=>{const p=Math.min(100,m/DAY_CAP*100);return `<div class="capbar" title="${fmtMin(m)} of 7 h"><div style="width:${p}%;background:${m>DAY_CAP?"var(--bad)":m>=DAY_CAP-30?"#16794A":"#000000"}"></div></div>`;};
  return `<div class="wrap"><div class="between" style="flex-wrap:wrap;gap:10px"><h1 class="h1">Efficiency</h1>
   <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm ghost" data-act="eff-day" data-n="-1" aria-label="Previous day">‹</button><label class="sr" for="effd">Day</label><input id="effd" type="date" class="in" value="${day}" data-act-change="eff-pick" style="width:auto"><button class="btn sm ghost" data-act="eff-day" data-n="1" aria-label="Next day">›</button>${day!==today()?`<button class="linkbtn small" data-act="eff-day" data-n="0">Today</button>`:""}

   </tbody></table></div><p class="xs muted" style="margin:6px 0 0">Time saved counts only subtasks finished, against their allotted time (including approved extra time). Subtasks belong to the day they were allotted.</p></section></div>`;

function remMark(key){remShown[key]=true;try{localStorage.setItem("nanma_rem_"+S.me+"_"+key,"1");}catch(_){}}
function remShow(icon,title,msg){let box=document.getElementById("rembox");if(!box){box=document.createElement("div");box.id="rembox";box.setAttribute("aria-live","polite");document.body.appendChild(box);}

function remTick(){if(!S.me||loginGate())return;const now=new Date();if(now.getDay()===0)return;const day=today();const first=(nm(S.me)||"there").split(" ")[0];const t=hm(now);
  const within=(at)=>{const [h,m]=at.split(":").map(Number);const mins=now.getHours()*60+now.getMinutes()-(h*60+m);return mins>=0&&mins<15;};

/* ================= Nanma company calendar: working days, holidays, education speech ================= */
const NC_TYPES={work:["Working day","#16794A","#E6F6EC"],half:["Half day","#A35B00","#FFF4E0"],holiday:["Holiday / leave","#B4282D","#FDECEC"],off:["Off","#586476","#F0F0F0"]};
const ncDays=()=>(S.ncal&&S.ncal.days)||{};
const ncSp=()=>(S.ncal&&S.ncal.speech)||{};
function satIndex(d){return Math.floor((new Date(d+"T00:00:00").getDate()-1)/7)+1;}
function defaultDay(d){const wd=new Date(d+"T00:00:00").getDay();if(wd===0)return {type:"off"};if(wd===6&&satIndex(d)===4)return {type:"half",until:"13:15",auto:"4th Saturday"};return {type:"work"};}
function dayInfo(d){const o=ncDays()[d];return o?Object.assign({},defaultDay(d),o,{set:true}):defaultDay(d);}
const isOpenDay=d=>{const t=dayInfo(d).type;return t==="work"||t==="half";};
function dayCap(d){return dayInfo(d).type==="half"?240:DAY_CAP;}
const fmt12=t=>{if(!t)return"";const [h,m]=t.split(":").map(Number);return `${(h%12)||12}:${String(m).padStart(2,"0")} ${h<12?"am":"pm"}`;};
const dayLabel=i=>i.type==="holiday"?(i.name||"Holiday"):i.type==="half"?`Half day till ${fmt12(i.until||"13:15")}`:i.type==="off"?"Off":"Working day";
/* speech rotation */
function speechOrder(){const ms=members();const sp=ncSp();const ord=(sp.order||[]).filter(u=>ms[u]);const rest=Object.keys(ms).filter(u=>!ord.includes(u)).sort((a,b)=>(ms[a].name||"").localeCompare(ms[b].name||""));return [...ord,...rest];}
const speechPool=()=>speechOrder().filter(u=>!(ncSp().skip||{})[u]);
let _spMemo={key:"",map:{}};
function speakerOn(d){const sp=ncSp();const ov=(sp.over||{})[d];if(ov==="none")return null;if(ov)return members()[ov]?ov:null;if(!isOpenDay(d))return null;const st=sp.start;if(!st||d<st)return null;const pool=speechPool();if(!pool.length)return null;
  const key=JSON.stringify([sp,ncDays(),pool]);if(_spMemo.key!==key)_spMemo={key,map:{}};if(d in _spMemo.map)return _spMemo.map[d];
  let n=0,x=st;while(x<d){if(isOpenDay(x)&&!(sp.over||{})[x])n++;x=dayShift(x,1);}const u=pool[n%pool.length];_spMemo.map[d]=u;return u;}
function ncSave(next,msg){const o=clone(next);delete o.id;write("crm/calendar",o);S.ncal=o;if(msg)logAct(msg,"");renderAll();}
const ncYm=()=>S.ncMonth||thisMonth();

  let nh=null;for(let k=1,x=dayShift(t,1);k<=60;k++,x=dayShift(x,1)){const j=dayInfo(x);if(j.type==="holiday"){nh=[x,j];break;}}
  const c=NC_TYPES[i.type]||NC_TYPES.work;

    const all=rows.flatMap(r=>r.hs);
    body=`<section class="panel"><div class="between" style="flex-wrap:wrap;gap:10px"><div class="row" style="gap:6px"><button class="btn sm ghost" data-act="nc-year" data-n="-1" aria-label="Previous year">‹</button><h2 class="h2">${y}</h2><button class="btn sm ghost" data-act="nc-year" data-n="1" aria-label="Next year">›</button></div>${hr?`<button class="btn sm" data-act="nc-add">+ Add holiday / leave</button>`:""}</div>

     <h3 class="h2" style="font-size:16px">Working days by month</h3>

  else{const sp=ncSp();const ord=speechOrder();const pool=speechPool();const td=today();const up=[];for(let k=0,x=td;k<60&&up.length<12;k++,x=dayShift(x,1)){const u=speakerOn(x);if(u)up.push([x,u]);}

const _mh={};
function monthHours(ym){const key=ym+"|"+JSON.stringify(ncDays());if(_mh[key])return _mh[key];const [y,mo]=ym.split("-").map(Number);const dim=new Date(y,mo,0).getDate();let h=0;for(let d=1;d<=dim;d++){const t=dayInfo(ym+"-"+String(d).padStart(2,"0")).type;h+=t==="work"?7:t==="half"?4:0;}_mh[key]=h||1;return _mh[key];}
function hourlyRate(uid,day){const sal=salaryOf(uid);if(!sal)return null;return sal/monthHours((day||today()).slice(0,7));}
const rupee=n=>"₹"+Math.round(n).toLocaleString("en-IN");
function cardCost(c){let plan=0,actual=0,missing=new Set();const rows=(c.subs||[]).map(s=>{const rate=hourlyRate(s.a,s.day);const pm=Number(s.min)||0;const um=usedMs(s,c.id)/60000;if(rate==null){missing.add(s.a);return {s,rate:null,pm,um};}const pc=rate*pm/60,ac=rate*um/60;plan+=pc;actual+=ac;return {s,rate,pm,um,pc,ac};});return {rows,plan,actual,missing};}
function costSection(c){const k=cardCost(c);if(!k.rows.length)return"";const ai=aiCostRows(c);const oh=ohCard(c);const ohr=ohRate((((c.subs||[])[0]||{}).day||today()).slice(0,7));
  return `<section class="costbox"><div class="between"><h3 class="h2" style="font-size:16px">Operation cost</h3><span class="xs muted">Visible only to HR, admins and department heads</span></div>
  <div class="tablewrap"><table><thead><tr><th>Subtask</th><th>Person</th><th>Hourly cost</th><th>Allotted</th><th>Planned cost</th><th>Time used</th><th>Actual cost</th></tr></thead><tbody>
  ${k.rows.map(r=>`<tr><td>${esc(subName(r.s))}</td><td><div class="row xs">${av(r.s.a,18)}${esc(nm(r.s.a))}</div></td><td>${r.rate==null?`<span class="xs" style="color:var(--bad)">No salary on file</span>`:rupee(r.rate)+"/h"}</td><td>${fmtMin(r.pm)}</td><td>${r.rate==null?"–":rupee(r.pc)}</td><td>${r.um?fmtMin(Math.round(r.um)):"–"}</td><td>${r.rate==null||!r.um?"–":`<strong>${rupee(r.ac)}</strong>`}</td></tr>`).join("")}
  <tr style="background:#F7F7F7"><td colspan="4"><strong>Total</strong></td><td><strong>${rupee(k.plan)}</strong></td><td></td><td><strong style="color:${k.actual>k.plan&&k.plan?"var(--bad)":"inherit"}">${rupee(k.actual)}</strong>${k.plan&&k.actual?`<div class="xs muted">${k.actual>k.plan?rupee(k.actual-k.plan)+" over plan":rupee(k.plan-k.actual)+" under plan"}</div>`:""}</td></tr></tbody></table></div>
  ${ohr?`<p class="small" style="margin:6px 0 0">Overhead (${rupee(ohr)}/h): planned ${rupee(oh.plan)} · actual <strong>${rupee(oh.actual)}</strong>${oh.afterH?` <span class="xs" style="color:#A35B00">incl. ${rupee(oh.after)} for ${fmtMin(Math.round(oh.afterH*60))} after 6 pm</span>`:""}</p>`:`<p class="xs muted" style="margin:6px 0 0">Overhead not added – set the monthly operating cost on the Op. cost page.</p>`}${ai.html}<p class="small" style="margin:8px 0 0;padding:8px 10px;background:#F7F7F7;border-radius:8px"><strong>Total actual: ${rupee(k.actual+oh.actual+ai.sum)}</strong> <span class="muted xs">= people ${rupee(k.actual)} + overhead ${rupee(oh.actual)}${ai.sum?" + AI "+rupee(ai.sum):""} · planned ${rupee(k.plan+oh.plan)}</span></p><p class="xs muted" style="margin:0">Hourly cost = monthly salary ÷ that month's working hours on the Nanma calendar (7 h a working day, 4 h a half day). Planned cost uses the allotted minutes; actual cost uses the time logged on the timer. AI credits cost what was paid per credit for that purchase.${k.missing.size?` Add salaries for ${[...k.missing].map(u=>esc(nm(u))).join(", ")} in Team → Details to include them.`:""}</p></section>`;}

function ohMonth(ym){const ms=ohDoc().months||{};if(ms[ym]&&(ms[ym].items||[]).length)return {ym,src:ym,m:ms[ym]};const prev=Object.keys(ms).filter(k=>k<ym&&(ms[k].items||[]).length).sort().pop();return prev?{ym,src:prev,m:ms[prev]}:null;}

    <ol class="small" style="margin:6px 0 0;padding-left:20px">${stepsOf(t).map(x=>`<li>${esc(x[0])} <span class="muted">· ${esc(st[x[1]]||x[1])} · ${x[2]?fmtMin(x[2]):"no time set"}</span></li>`).join("")}</ol></div>

   <p class="small muted" style="margin:0">A template is the list of subtasks a card starts with – in order, with the stage and time for each. Your templates are yours: other people have their own. Make one for all your clients or just for one client. Pick a template from the <strong>Format</strong> list when you create a card (under “My templates”). Mark one as <strong>Default</strong> and new cards of that format start with it automatically.</p>

function dShift(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return dayOf(x.getTime());}
function rpRange(){const r=S.rp||{k:"week"};const td=today();const wd=(new Date(td+"T00:00:00").getDay()+6)%7;const ym=td.slice(0,7);
  const lm=(()=>{const x=new Date(td+"T00:00:00");x.setDate(1);x.setMonth(x.getMonth()-1);return dayOf(x.getTime()).slice(0,7);})();const endOf=m=>{const [y,mo]=m.split("-").map(Number);return m+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0");};
  switch(r.k){case"today":return[td,td];case"yday":return[dShift(td,-1),dShift(td,-1)];case"week":return[dShift(td,-wd),dShift(td,6-wd)];case"lweek":return[dShift(td,-wd-7),dShift(td,-wd-1)];
    case"month":return[ym+"-01",endOf(ym)];case"lmonth":return[lm+"-01",endOf(lm)];case"year":return[td.slice(0,4)+"-01-01",td.slice(0,4)+"-12-31"];case"lyear":{const y=Number(td.slice(0,4))-1;return[y+"-01-01",y+"-12-31"];}
    default:return[r.from||td,r.to||td];}}
function rpData(F,T){const t0=new Date(F+"T00:00:00").getTime(),t1=new Date(T+"T00:00:00").getTime()+86400000;const inR=d=>d&&d>=F&&d<=T;const now=Date.now();
  const ppl=payPeople().filter(u=>underMe(u));const P=new Set(ppl);const per={};ppl.forEach(u=>per[u]={u,fin:0,ontime:0,late:0,stars:0,ms:0,allot:0,due:0,missed:0,openNow:0,overdueNow:0});
  const cl={};const C=id=>cl[id]=cl[id]||{id,created:0,done:0,fin:0,ms:0,bill:0,fmt:{}};const fmt={};let created=0,doneCards=0,tatI=[],tatC=[];
  const cards=Object.values(S.cards).filter(c=>canSeeBoard(c.board)&&c.col!=="notnow"&&(isHR()||(c.subs||[]).some(x=>P.has(x.a))||P.has(c.assigner)));
  for(const c of cards){const cd=dayOf(c.created||0);if(inR(cd)){created++;C(c.client).created++;}
    const dd=billDoneDay(c);if(inR(dd)){doneCards++;const k=c.format||"Other";fmt[k]=(fmt[k]||0)+1;const x=C(c.client);x.done++;x.fmt[k]=(x.fmt[k]||0)+1;if(c.bill&&c.bill.amt)x.bill+=c.bill.amt;const ti=tat(c,"int"),tc=tat(c,"client");if(ti.rounds)tatI.push(ti.total);if(tc.rounds)tatC.push(tc.total);}
    for(const sb of c.subs||[]){if(!P.has(sb.a))continue;const p=per[sb.a];const r=rate(sb,c.id);
      if(r.fin0&&inR(dayOf(r.fin0))){p.fin++;p.stars+=r.stars;p.allot+=Number(sb.min)||0;if(sb.day&&dayOf(r.fin0)>sb.day)p.late++;else p.ontime++;C(c.client).fin++;}
      if(inR(sb.day)){p.due++;if(!r.fin0&&sb.day<today())p.missed++;}
      if(!r.done&&c.col!=="done"){p.openNow++;if(sb.day&&sb.day<today())p.overdueNow++;}
      const lg=subLog(sb,c.id);let ms=0;for(const x of lg.s||[])ms+=Math.max(0,Math.min(x[1],t1)-Math.max(x[0],t0));const ru=runOf(sb,c.id);if(ru)ms+=Math.max(0,Math.min(now,t1)-Math.max(ru.t,t0));p.ms+=ms;C(c.client).ms+=ms;}}
  const rows=ppl.map(u=>per[u]).sort((a,b)=>b.fin-a.fin||b.ms-a.ms);const tot=k=>rows.reduce((t,r)=>t+r[k],0);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return{rows,clients:Object.values(cl).filter(x=>x.created||x.done||x.fin||x.ms).sort((a,b)=>b.done-a.done||b.ms-a.ms),created,doneCards,fmt,fin:tot("fin"),ontime:tot("ontime"),late:tot("late"),ms:tot("ms"),allot:tot("allot"),stars:tot("stars"),missed:tot("missed"),overdueNow:tot("overdueNow"),tatI:avg(tatI),tatC:avg(tatC)};}

  const r=S.rp||{k:"week"};const [F,T]=rpRange();const D=rpData(F,T);const hrs=ms=>fmtMin(Math.round(ms/60000));const pct=(a,b)=>b?Math.round(a*100/b)+"%":"–";

function xlsRows(buf){const dv=new DataView(buf);const u8=new Uint8Array(buf);
  const ss=1<<dv.getUint16(30,true),mss=1<<dv.getUint16(32,true);const nFat=dv.getUint32(44,true),dirStart=dv.getUint32(48,true),miniCut=dv.getUint32(56,true),miniFatStart=dv.getUint32(60,true),difStart=dv.getUint32(68,true);
  const off=s=>(s+1)*ss;const difat=[];for(let i=0;i<109;i++){const v=dv.getUint32(76+i*4,true);if(v<0xFFFFFFFA)difat.push(v);}
  let ds=difStart,guard=0;while(ds<0xFFFFFFFA&&guard++<1000){for(let i=0;i<ss/4-1;i++){const v=dv.getUint32(off(ds)+i*4,true);if(v<0xFFFFFFFA)difat.push(v);}ds=dv.getUint32(off(ds)+ss-4,true);}
  const fat=[];difat.slice(0,nFat).forEach(s=>{for(let i=0;i<ss/4;i++)fat.push(dv.getUint32(off(s)+i*4,true));});
  const chain=s=>{const out=[];let g=0;while(s<0xFFFFFFFA&&g++<1e6){out.push(s);s=fat[s];}return out;};
  const readChain=(s)=>{const c=chain(s);const b=new Uint8Array(c.length*ss);c.forEach((x,i)=>b.set(u8.subarray(off(x),off(x)+ss),i*ss));return b;};
  const dir=readChain(dirStart);const ddv=new DataView(dir.buffer);const ents=[];
  for(let o=0;o+128<=dir.length;o+=128){const nl=ddv.getUint16(o+64,true);let name="";for(let i=0;i<nl/2-1;i++)name+=String.fromCharCode(ddv.getUint16(o+i*2,true));ents.push({name,type:dir[o+66],start:ddv.getUint32(o+116,true),size:ddv.getUint32(o+120,true)});}
  const wbE=ents.find(e=>/^(workbook|book)$/i.test(e.name));if(!wbE)throw new Error("Not an Excel 97-2003 file");
  let wb;if(wbE.size>=miniCut)wb=readChain(wbE.start).subarray(0,wbE.size);else{const root=readChain(ents[0].start);const mf=readChain(miniFatStart);const mdv=new DataView(mf.buffer);const mfat=[];for(let i=0;i<mf.length/4;i++)mfat.push(mdv.getUint32(i*4,true));wb=new Uint8Array(wbE.size);let s=wbE.start,p=0;while(s<0xFFFFFFFA&&p<wbE.size){wb.set(root.subarray(s*mss,s*mss+mss).subarray(0,Math.min(mss,wbE.size-p)),p);p+=mss;s=mfat[s];}}
  const w=new DataView(wb.buffer,wb.byteOffset,wb.byteLength);
  // records
  const recs=[];for(let p=0;p+4<=wb.length;){const t=w.getUint16(p,true),l=w.getUint16(p+2,true);recs.push([t,p+4,l]);p+=4+l;}
  const sst=[];const cells={};let sheet=-1;const setC=(r,c,v)=>{if(sheet!==0)return;(cells[r]=cells[r]||{})[c]=v;};
  const rk=v=>{let n;if(v&2){n=v>>2;}else{const b=new DataView(new ArrayBuffer(8));b.setUint32(4,v&0xFFFFFFFC,true);b.setUint32(0,0,true);n=b.getFloat64(0,true);}return v&1?n/100:n;};

        let str="",left=cch;while(left>0){if(pos>=end){pi++;pos=parts[pi][0];end=pos+parts[pi][1];fl=wb[pos++];}const wide=fl&1;const avail=wide?Math.floor((end-pos)/2):end-pos;const take=Math.min(left,avail);for(let q=0;q<take;q++){str+=String.fromCharCode(wide?w.getUint16(pos,true):wb[pos]);pos+=wide?2:1;}left-=take;}
        let skip=rt*4+ext;while(skip>0){if(pos>=end){pi++;pos=parts[pi][0];end=pos+parts[pi][1];}const s2=Math.min(skip,end-pos);pos+=s2;skip-=s2;}

    else if(t===0x00FD){setC(w.getUint16(p,true),w.getUint16(p+2,true),sst[w.getUint32(p+6,true)]);}
    else if(t===0x0203){setC(w.getUint16(p,true),w.getUint16(p+2,true),w.getFloat64(p+6,true));}
    else if(t===0x027E){setC(w.getUint16(p,true),w.getUint16(p+2,true),rk(w.getUint32(p+6,true)));}

  }
  const maxR=Math.max(-1,...Object.keys(cells).map(Number));const out=[];for(let r=0;r<=maxR;r++){const row=cells[r]||{};const mc=Math.max(-1,...Object.keys(row).map(Number));const a=[];for(let c=0;c<=mc;c++)a.push(row[c]==null?"":String(row[c]));out.push(a);}return out;}

const MON={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
function esslDate(v){const m=String(v).trim().match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{4})$/);if(m&&MON[m[2]])return m[3]+"-"+MON[m[2]]+"-"+m[1].padStart(2,"0");const n=String(v).trim().match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);if(n)return n[3]+"-"+n[2].padStart(2,"0")+"-"+n[1].padStart(2,"0");return "";}
function esslSt(st){st=String(st||"").replace(/\s+/g," ").trim();if(!st)return"";if(/weeklyoff|holiday/i.test(st))return /present/i.test(st)&&!/absent/i.test(st)?"WOP":"WO";if(/½|half/i.test(st))return"H";if(/^absent/i.test(st))return"A";if(/present/i.test(st))return"P";if(/leave/i.test(st))return"L";return"";}
function esslParse(rows){let date="",hdr=null;const codes={};
  for(const r of rows){const j=r.findIndex(x=>/attendance date/i.test(x));if(j>=0){const v=r.slice(j+1).find(x=>String(x).trim());date=esslDate(v||"");continue;}
    if(r.some(x=>/^e\.? ?code$/i.test(String(x).trim()))){const f=n=>r.findIndex(x=>n.test(String(x).trim()));hdr={code:f(/^e\.? ?code$/i),name:f(/^name$/i),inT:f(/^a\.? ?intime$/i),outT:f(/^a\.? ?outtime$/i),late:f(/^lateby$/i),early:f(/^earlygoingby$/i),st:f(/^status$/i)};continue;}
    if(!hdr||!date)continue;const code=String(r[hdr.code]||"").trim();if(!code||/^department$/i.test(String(r[1]||"").trim()))continue;const stRaw=r[hdr.st];if(stRaw==null||String(stRaw).trim()==="")continue;
    const c=codes[code]=codes[code]||{name:String(r[hdr.name]||"").trim(),days:{}};
    c.days[date]={i:String(r[hdr.inT]||"").trim(),o:String(r[hdr.outT]||"").trim(),s:esslSt(stRaw),raw:String(stRaw).replace(/\s+/g," ").trim(),lb:String(r[hdr.late]||"").trim(),eb:String(r[hdr.early]||"").trim()};}
  return codes;}
function csvRows(t){const out=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else if(ch==='"')q=true;else if(ch===","){row.push(cur);cur="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur="";}else cur+=ch;}if(cur||row.length){row.push(cur);out.push(row);}return out;}
function esslMap(){return(S.creds.att_map||{}).map||{};}
function esslGuess(code,name){const m=esslMap();if(m[code])return m[code];const n=String(name||"").toLowerCase().trim();if(!n||/^\d+$/.test(n))return"";const hit=payPeople().find(u=>nm(u).toLowerCase()===n)||payPeople().find(u=>nm(u).toLowerCase().startsWith(n.split(" ")[0])&&n.length>2);return hit||"";}
async function esslFile(file){try{const buf=await file.arrayBuffer();let rows;if(/\.csv$/i.test(file.name))rows=csvRows(new TextDecoder().decode(buf));else rows=xlsRows(buf);const codes=esslParse(rows);const n=Object.keys(codes).length;
  if(!n){toast("Couldn't find attendance rows in that file. Use eTimeTrackLite → Daily Attendance Report (Detailed) saved as .xls.");return;}
  const sel={};Object.entries(codes).forEach(([k,v])=>{sel[k]=esslGuess(k,v.name);});S.esslImp={file:file.name,codes,sel};renderMain();}catch(e){toast("Couldn't read that file: "+(e&&e.message||e));}}
function esslApply(){const imp=S.esslImp;if(!imp)return;const map=Object.assign({},esslMap());const byYm={};let n=0;
  Object.entries(imp.codes).forEach(([code,v])=>{const u=imp.sel[code];if(u==="skip"){map[code]="skip";return;}if(!u)return;map[code]=u;n++;Object.entries(v.days).forEach(([d,x])=>{const ym=d.slice(0,7);((byYm[ym]=byYm[ym]||{})[u]=byYm[ym][u]||{})[d]={i:x.i,o:x.o,s:x.s,raw:x.raw,lb:x.lb,eb:x.eb};});});
  Object.entries(byYm).forEach(([ym,us])=>{const doc=clone(attDoc(ym));if(doc.locked)return;doc.essl=Object.assign({},doc.essl||{});Object.entries(us).forEach(([u,ds])=>{doc.essl[u]=Object.assign({},doc.essl[u]||{},ds);});doc.esslAt=Date.now();attSave(ym,doc);});

function esslPanel(){const imp=S.esslImp;if(!imp)return"";const ppl=payPeople();const ents=Object.entries(imp.codes).sort((a,b)=>Object.values(b[1].days).filter(x=>x.s==="P"||x.s==="H").length-Object.values(a[1].days).filter(x=>x.s==="P"||x.s==="H").length);

function toMin(hm){const m=String(hm||"").match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null;}

  for(const q of leavesOf(u))if(q.st==="ok")for(const x of q.days||[])if(x[0]===d){const w=x[1],paid=x[2]!==0;return paid?(w<1?"PLH":"PL"):(w<1?"ULH":"UL");}

function officeMs(a,b){let t=0;let d=new Date(a);d.setHours(0,0,0,0);while(d.getTime()<b){const ds=dayOf(d.getTime());const inf=dayInfo(ds);if(inf.type!=="off"){const os=d.getTime()+OFFICE_START*60000;let oe=d.getTime()+OFFICE_END*60000;if(inf.type==="half"&&inf.until){const[h,m]=String(inf.until).split(":").map(Number);oe=d.getTime()+(h*60+(m||0))*60000;}t+=Math.max(0,Math.min(b,oe)-Math.max(a,os));}d.setDate(d.getDate()+1);}return t;}
function stints(c,col){const hs=(c.hist||[]).filter(h=>h.t==="move").slice().sort((x,y)=>x.at-y.at);const out=[];let st=null;
  hs.forEach(h=>{if(h.to===col&&st==null)st=h.at;else if(h.from===col&&st!=null){out.push([st,h.at]);st=null;}});
  if(c.col===col){if(st==null){const lastIn=hs.filter(h=>h.to===col).pop();st=lastIn?lastIn.at:(hs.length?hs[hs.length-1].at:(c.created||Date.now()));}out.push([st,null]);}return out;}
function tat(c,col){const office=col!=="client";const now=Date.now();const st=stints(c,col);const f=([a,b])=>office?officeMs(a,b||now):(b||now)-a;
  const cur=st.length&&st[st.length-1][1]==null?st[st.length-1]:null;return{rounds:st.length,total:st.reduce((t,x)=>t+f(x),0),cur:cur?f(cur):null,since:cur?cur[0]:null,office};}
function fmtSpan(ms){const m=Math.floor(ms/60000);if(m<1)return"0 m";const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return [d?d+" d":"",h?h+" h":"",(!d&&mm)||(d&&!h&&mm)?mm+" m":""].filter(Boolean).join(" ")||"0 m";}
