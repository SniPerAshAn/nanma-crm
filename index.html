function tatChip(c){if(c.col!=="int"&&c.col!=="client")return"";const t=tat(c,c.col);if(t.cur==null)return"";
  return c.col==="int"?`<span class="chip" title="Office hours only (9 am – 6 pm on working days)">⏱ Internal approval ${tatLive(c,"int","cur")}</span>`:`<span class="chip" title="Counted round the clock since it was sent to the client">⏱ With client ${tatLive(c,"client","cur")}</span>`;}
function tatSection(c){const ti=tat(c,"int"),tc=tat(c,"client");if(!ti.rounds&&!tc.rounds)return"";
  const box=(lbl,t,col,note)=>t.rounds?`<div class="panel kpi" style="padding:12px 14px;box-shadow:none;border:1px solid var(--line)"><span class="muted small">${lbl}</span><strong style="font-size:22px">${tatLive(c,col,"total")}</strong><span class="xs muted">${t.cur!=null?`Waiting now: <b>${tatLive(c,col,"cur")}</b> (since ${esc(fmtWhen(t.since))}) · `:""}${t.rounds} round${t.rounds>1?"s":""} · ${note}</span></div>`:"";
  return `<section><h3 class="h2" style="font-size:16px;margin-bottom:6px">Approval turnaround</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${box("Internal approval",ti,"int","office hours only, 9 am – 6 pm")}${box("Client approval",tc,"client","round the clock")}</div></section>`;}

function afterMs(a,b){let t=0,x=a;while(x<b){const d=new Date(x);const day0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();const os=day0+OFFICE_START*60000,oe=day0+OFFICE_END*60000,next=day0+86400000;const end=Math.min(b,next);t+=Math.max(0,Math.min(end,os)-x)+Math.max(0,end-Math.max(x,oe));x=end;}return t;}
function afterByMonth(sub,cid){const out={};const add=(a,b)=>{const ms=afterMs(a,b);if(ms){const ym=new Date(a).toISOString().slice(0,7);out[ym]=(out[ym]||0)+ms;}};for(const x of subLog(sub,cid).s||[])add(x[0],x[1]);const r=runOf(sub,cid);if(r)add(r.t,Date.now());return out;}
function usedByMonth(sub,cid){const out={};for(const x of subLog(sub,cid).s||[]){const ym=new Date(x[0]).toISOString().slice(0,7);out[ym]=(out[ym]||0)+(x[1]-x[0]);}const r=runOf(sub,cid);if(r){const ym=new Date(r.t).toISOString().slice(0,7);out[ym]=(out[ym]||0)+(Date.now()-r.t);}return out;}
function ohCard(c){let plan=0,actual=0,after=0,afterH=0;for(const s of c.subs||[]){const pm=Number(s.min)||0;plan+=pm/60*ohRate((s.day||today()).slice(0,7));const u=usedByMonth(s,c.id);for(const [ym,ms] of Object.entries(u))actual+=ms/3600000*ohRate(ym);const af=afterByMonth(s,c.id);for(const [ym,ms] of Object.entries(af)){after+=ms/3600000*ohRate(ym);afterH+=ms/3600000;}}return {plan,actual,after,afterH};}
function ohCovered(ym){let ms=0,af=0;for(const c of Object.values(S.cards))for(const s of c.subs||[]){const u=usedByMonth(s,c.id);ms+=u[ym]||0;af+=(afterByMonth(s,c.id)[ym]||0);}const r=ohRate(ym);return {hours:ms/3600000,amt:(ms-af)/3600000*r,afterH:af/3600000,after:af/3600000*r};}
function ohSave(ym,m,msg){if(!canEditOH())return;const d=clone(ohDoc());delete d.id;d.months=Object.assign({},d.months||{});d.months[ym]=m;S.oh=d;write("crm/opcost",d);if(msg)logAct(msg,"");renderAll();}
function viewOH(){if(!canSeeCost())return `<div class="wrap"><p>Only HR, admins and department heads can see operating cost.</p></div>`;
  const ym=S.ohYm||thisMonth();const o=ohMonth(ym);const tot=ohTotal(ym);const hp=monthHours(ym);const st=ohStaff(ym);const avail=st*hp;const rate=ohRate(ym);const cov=ohCovered(ym);const ed=canEditOH();
  const items=o?(o.m.items||[]):[];const carried=o&&o.src!==ym;
  const nav=`<div class="row" style="gap:6px"><button class="btn sm ghost" data-act="oh-m" data-d="-1" aria-label="Previous month">‹</button><strong style="min-width:130px;text-align:center">${ymName(ym)}</strong><button class="btn sm ghost" data-act="oh-m" data-d="1" aria-label="Next month">›</button></div>`;
  const kpi=(l,v,sub,col)=>`<div class="panel kpi"><span class="small" style="font-weight:700">${l}</span><strong${col?` style="color:${col}"`:""}>${v}</strong><span class="xs muted">${sub}</span></div>`;
  const tiles=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${kpi("Operating cost",tot?rupee(tot):"Not set",!o?"":carried?`estimate – using ${ymName(o.src)}`:o.m.final?"actual for this month":"estimate from previous months")}${kpi("Available hours",Math.round(avail).toLocaleString("en-IN")+" h",`${st} people × ${hp} h`)}${kpi("Overhead per hour",rate?rupee(rate)+"/h":"–","added to every hour of task work")}${kpi("Covered by tasks",tot?rupee(cov.amt):"–",`${Math.round(cov.hours-cov.afterH).toLocaleString("en-IN")} h tracked in office hours${tot?` · ${Math.round(cov.amt/tot*100)}% of the month`:""}`,"var(--good)")}${kpi("After-hours work",tot?rupee(cov.after):"–",`${(Math.round(cov.afterH*10)/10).toLocaleString("en-IN")} h outside 9:00–6:00 – extra overhead`,cov.afterH?"#A35B00":"")}${kpi("Not covered yet",tot?rupee(Math.max(0,tot-cov.amt)):"–",ym<thisMonth()?"hours not tracked on any task":"so far – fills in as work is tracked",tot&&ym<thisMonth()&&tot-cov.amt>tot*0.3?"var(--bad)":"")}</div>`;
  let split="";
  if(ed){split=`<section class="panel"><div class="between"><h2 class="h2">Split-up for ${ymName(ym)}</h2>${carried?`<span class="chip">Estimate from ${ymName(o.src)} – save to set this month</span>`:o&&o.m.final?`<span class="chip good">Actual</span>`:o?`<span class="chip warn">Estimate</span>`:""}</div>
    <form data-form="ohform" id="ohform"><div class="tablewrap"><table><thead><tr><th>Item</th><th style="width:180px">Amount (₹)</th><th style="width:40px"></th></tr></thead><tbody>${(S.ohDraft||items).map((x,i)=>`<tr><td><input class="in" data-ohi="${i}" data-k="name" value="${esc(x.name||"")}" placeholder="e.g. Rent" aria-label="Item name"></td><td><input class="in" type="number" min="0" step="any" data-ohi="${i}" data-k="amt" value="${esc(x.amt??"")}" aria-label="Amount"></td><td><button type="button" class="btn sm ghost" data-act="oh-del" data-i="${i}" aria-label="Remove line">✕</button></td></tr>`).join("")}
    <tr style="background:#F7F7F7"><td><strong>Total</strong></td><td><strong id="ohtot">${rupee((S.ohDraft||items).reduce((t,x)=>t+(Number(x.amt)||0),0))}</strong></td><td></td></tr></tbody></table></div>
    <div class="between" style="flex-wrap:wrap;gap:8px;margin-top:8px"><div class="row" style="gap:8px;align-items:center"><button type="button" class="btn sm ghost" data-act="oh-add">+ Add line</button><label class="small row" style="gap:6px"><input type="checkbox" id="ohfinal" ${o&&o.src===ym&&o.m.final?"checked":""}> These are the actual costs for this month</label><label class="small row" style="gap:6px">People counted<input class="in" type="number" min="1" id="ohstaff" value="${esc(o&&o.src===ym&&o.m.staff?o.m.staff:"")}" placeholder="${Object.keys(members()).length}" style="width:80px" aria-label="People counted"></label></div><button class="btn" type="submit">Save ${ymName(ym)}</button></div>
    <p class="xs muted" style="margin:6px 0 0">Leave “People counted” empty to use everyone in the CRM (${Object.keys(members()).length}). Salaries are not part of this – they're already counted per task. A month you don't set uses the last month you did.</p></form></section>`;}
  else split=ocFlag()&&!S.admin?`<p class="small muted">You can see the operating cost. To update it, ask HR to give you Editor access to the CRM.</p>`:`<p class="small muted">HR and admins keep the split-up. You see the total and the hourly overhead on every card.</p>`;
  return `<div class="wrap"><div class="between" style="flex-wrap:wrap;gap:10px"><h1 class="h1">Operating cost</h1>${nav}</div>${tiles}${split}
   <section class="panel"><h2 class="h2" style="font-size:16px">How it's worked out</h2><p class="small" style="margin:0">Operating cost ÷ available hours (people × working hours on the Nanma calendar: 7 h a working day, 4 h a half day) = overhead per hour. Every hour someone tracks on a subtask adds that much to the card's operation cost, in the month the work happened. Office hours are 9:00 am – 6:00 pm; time tracked outside them is shown as after-hours work, an extra overhead on top of the month's cost. Until HR enters the actual costs at month end, the month uses an estimate from previous months, and every card updates automatically once the actual figure is saved.</p></section></div>`;}

/* ---------- Home tiles: click for details ---------- */
document.addEventListener("keydown",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("tclick")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();}});
function tileData(kind){const cards=Object.values(S.cards).filter(c=>canSeeBoard(c.board)),t=today();const out=[];
  if(kind==="waiting"){for(const c of cards)if(c.col==="int"||c.col==="client")out.push([c]);return out.sort((a,b)=>(a[0].col>b[0].col?1:-1));}
  for(const c of cards){if(c.col==="done"||c.col==="notnow")continue;for(const s of c.subs||[]){const r=rate(s,c.id);
    if(kind==="due"&&!r.done&&s.day===t)out.push([c,s,r]);
    if(kind==="late"&&r.status==="late")out.push([c,s,r]);
    if(kind==="running"&&runOf(s,c.id))out.push([c,s,r,runOf(s,c.id)]);}}
  if(kind==="late")out.sort((a,b)=>(a[1].day||"").localeCompare(b[1].day||""));
  if(kind==="running")out.sort((a,b)=>a[3].t-b[3].t);
  return out;}
const TILE_T={due:"Due today",late:"Late",waiting:"Waiting for approval",running:"Timers running now"};
function modalTile(m){const rows=tileData(m.k);const cl=c=>esc((S.clients[c.client]||{}).name||"");
  const body=!rows.length?`<p class="muted">Nothing here right now.</p>`:m.k==="waiting"?rows.map(([c])=>`<button class="tlrow" data-act="open-card" data-c="${esc(c.id)}"><span class="chip ${c.col==="client"?"info":"warn"}" style="flex:none">${c.col==="client"?"Client":"Internal"}</span><span style="flex:1;min-width:0"><strong>${esc(c.title)}</strong><span class="xs muted"> · ${cl(c)} · ${esc((S.boards[c.board]||{}).name||"")}</span><div class="xs muted">Assigned by ${esc(nm(c.assigner||c.by))}${c.hist&&c.hist[0]?` · waiting since ${fmtWhen(c.hist[0].at)}`:""}</div></span></button>`).join("")
   :rows.map(([c,s,r,run])=>`<button class="tlrow" data-act="open-card" data-c="${esc(c.id)}">${av(s.a,30)}<span style="flex:1;min-width:0"><strong>${esc(nm(s.a))}</strong><span class="xs muted"> · ${esc(subName(s))}</span>${isHi(s)?" "+hiChip(true):""}<div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)} <span class="xs muted">· ${cl(c)}</span></div><div class="xs muted">${m.k==="running"?`<span style="color:var(--good);font-weight:700">● running ${fmtMin(Math.round((Date.now()-run.t)/60000))}</span> · ${fmtMin(Math.round(usedMs(s,c.id)/60000))} of ${fmtMin(s.min)} used`:m.k==="late"?`<span style="color:var(--bad);font-weight:700">due ${fmtDay(s.day)}</span> · ${Number(s.min)?fmtMin(s.min)+" allotted":"no time limit"}`:`${Number(s.min)?fmtMin(s.min)+" allotted":"no time limit"} · ${fmtMin(Math.round(usedMs(s,c.id)/60000))} used`}</div></span>${statusChip(r)}</button>`).join("");
  const by={};if(m.k!=="waiting")rows.forEach(x=>{by[x[1].a]=(by[x[1].a]||0)+1;});
  const sum=m.k!=="waiting"&&rows.length>3?`<div class="row" style="gap:6px;flex-wrap:wrap">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([u,n])=>`<span class="chip">${esc(nm(u).split(" ")[0])} ${n}</span>`).join("")}</div>`:"";
  return `<div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="tlh"><div class="between"><h2 id="tlh" class="h2">${TILE_T[m.k]} <span class="chip">${rows.length}</span></h2><button type="button" class="btn sm ghost" data-act="close" aria-label="Close">✕</button></div>${sum}<div class="tllist">${body}</div></div>`;}

/* ---------- Leave applications ---------- */
const leavePaidPerMonth=()=>{const n=Number(S.team&&S.team.leavePaid);return isNaN(n)||S.team==null||S.team.leavePaid==null?1:n;};
const leavesOf=u=>((S.logs[u]||{}).leaves||[]);
const LV_ST={mgr:["Waiting for manager / head","warn"],hr:["Waiting for HR","warn"],ok:["Approved","good"],no:["Rejected","bad"],cancel:["Cancelled",""]};
function lvDays(from,to,half){const out=[];if(!from)return out;let d=from;const end=to&&to>=from?to:from;for(let i=0;i<120&&d<=end;i++,d=dayShift(d,1)){const t=dayInfo(d).type;if(t==="work")out.push([d,1]);else if(t==="half")out.push([d,0.5]);}if(half&&out.length===1)return [[out[0][0],0.5]];return out;}
function step1Approvers(u){const ms=members();const x=ms[u];if(!x||x.role==="head"||x.role==="hr"||x.admin)return[];const out=new Set();
  let code=x.reportsTo;for(let i=0;i<6&&code;i++){const m=Object.keys(ms).find(k=>ms[k].code===code);if(m&&m!==u)out.add(m);code=(S.invites[code]||{}).reportsTo;}
  for(const k of Object.keys(ms))if(k!==u&&ms[k].role==="head"&&ms[k].dept&&x.dept&&ms[k].dept.trim().toLowerCase()===x.dept.trim().toLowerCase())out.add(k);
  return [...out];}
function paidUsedOn(u,ym,skipId){let n=0;for(const q of leavesOf(u)){if(q.id===skipId||q.st==="no"||q.st==="cancel")continue;for(const [d,w,p] of q.days||[])if(d.slice(0,7)===ym&&p)n+=w;}return n;}
function lvSplit(u,days){const used={};const out=[];for(const [d,w] of days){const ym=d.slice(0,7);if(used[ym]==null)used[ym]=paidUsedOn(u,ym);const left=Math.max(0,leavePaidPerMonth()-used[ym]);const paid=left>=w;if(paid)used[ym]+=w;out.push([d,w,paid?1:0]);}return out;}
const lvSum=(q,paid)=>(q.days||[]).reduce((t,[d,w,p])=>t+(paid==null||!!p===paid?w:0),0);
function onLeave(u,d){for(const q of leavesOf(u))if(q.st==="ok")for(const [x,w] of q.days||[])if(x===d)return w;return 0;}
function canStep1(q,u){return q.st==="mgr"&&S.admin&&step1Approvers(u).includes(S.me);}
function canStepHR(q,u){return q.st==="hr"&&isHR()&&!!S.admin&&u!==S.me;}
function lvRange(q){const ds=(q.days||[]).map(x=>x[0]);if(!ds.length)return fmtDay(q.from);const a=ds[0],b=ds[ds.length-1];return a===b?fmtDay(a)+(q.half?" (half day)":""):`${fmtDay(a)} – ${fmtDay(b)}`;}
function lvWho(u){const a=step1Approvers(u);return a.length?`${a.map(x=>nm(x)).join(" or ")}, then HR`:"HR";}
function lvApplyOpen(){S.modal={type:"leave",f:{from:dayShift(today(),1),to:"",half:false,reason:""}};renderModal();}
function modalLeave(m){const f=m.f;const days=lvSplit(S.me,lvDays(f.from,f.to,f.half));const tot=days.reduce((t,x)=>t+x[1],0),paid=days.reduce((t,x)=>t+(x[2]?x[1]:0),0);const single=!f.to||f.to===f.from;
  return `<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="lvh" data-form="leave"><div class="between"><h2 id="lvh" class="h2">Apply for leave</h2><button type="button" class="btn sm ghost" data-act="close" aria-label="Close">✕</button></div>
   <div class="fields"><label class="field">From<input type="date" data-f="from" value="${esc(f.from)}" required data-act-change="rerender"></label><label class="field">To (optional)<input type="date" data-f="to" value="${esc(f.to)}" min="${esc(f.from)}" data-act-change="rerender"></label></div>
   ${single?`<label class="row small" style="gap:8px"><input type="checkbox" data-f="half" ${f.half?"checked":""} data-act-change="rerender"> Half day</label>`:""}
   <label class="field">Reason<textarea data-f="reason" rows="3" required maxlength="500" placeholder="e.g. Family function, not feeling well">${esc(f.reason)}</textarea></label>
   <div class="notice" style="margin:0">${tot?`<strong>${tot} day${tot===1?"":"s"}</strong> of leave (Sundays and holidays aren't counted). ${paid?`<strong>${paid}</strong> paid`:"No paid leave left"}${tot-paid?` · <strong>${tot-paid}</strong> unpaid (loss of pay)`:""}.`:"Those dates are all holidays or Sundays – no leave needed."}<br>You get ${leavePaidPerMonth()} paid leave a month. Goes to <strong>${esc(lvWho(S.me))}</strong> for approval.</div>
   <p id="lverr" class="small" style="color:var(--bad);margin:0"></p>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn" type="submit" ${tot?"":"disabled"}>Send request</button></div></form>`;}
function lvSubmit(f){const err=document.getElementById("lverr");if(!f.from){err.textContent="Choose the date.";return;}if(!(f.reason||"").trim()){err.textContent="Add a short reason.";return;}
  const days=lvSplit(S.me,lvDays(f.from,f.to,f.half));if(!days.length){err.textContent="Those dates are all holidays or Sundays.";return;}
  const clash=leavesOf(S.me).some(q=>q.st!=="no"&&q.st!=="cancel"&&(q.days||[]).some(([d])=>days.some(([x])=>x===d)));if(clash){err.textContent="You already have a leave request covering one of these days.";return;}
  const q={id:rid(),from:f.from,to:f.to||f.from,half:!!f.half&&days.length===1,days,reason:f.reason.trim().slice(0,500),at:Date.now(),st:step1Approvers(S.me).length?"mgr":"hr"};
  saveMyLogField("leaves",[...leavesOf(S.me),q].slice(-200));logAct(`applied for leave: ${lvRange(q)}`,"");closeModal();toast("Leave request sent to "+lvWho(S.me)+".");}
function lvDecide(u,id,ok,note){const L=clone(S.logs[u]||{});delete L.id;const q=(L.leaves||[]).find(x=>x.id===id);if(!q){toast("Request not found.");return;}
  if(q.st==="mgr"){if(!canStep1(q,u))return;q.s1={by:S.me,at:Date.now(),ok,note:note||""};q.st=ok?"hr":"no";}
  else if(q.st==="hr"){if(!canStepHR(q,u))return;q.s2={by:S.me,at:Date.now(),ok,note:note||""};q.st=ok?"ok":"no";}
  else{toast("This request was already handled.");return;}
  S.logs[u]=Object.assign({id:u},L);write("timelogs/"+u,L);logAct(`${ok?"approved":"rejected"} ${nm(u)}'s leave (${lvRange(q)})${q.st==="hr"?" – sent to HR":""}`,"");toast(ok?(q.st==="hr"?"Approved – sent to HR.":"Leave approved."):"Leave rejected.");renderAll();}
function lvCancel(id){const arr=clone(leavesOf(S.me));const q=arr.find(x=>x.id===id);if(!q||(q.st!=="mgr"&&q.st!=="hr"))return;q.st="cancel";q.cat=Date.now();saveMyLogField("leaves",arr);toast("Leave request cancelled.");}
function lvSteps(q,u){const s1=step1Approvers(u).length||q.s1;const st=(lbl,on,done,bad)=>`<span class="lvstep${done?" done":""}${bad?" bad":""}${on?" on":""}">${lbl}</span>`;
  return `<div class="row" style="gap:4px;flex-wrap:wrap">${st("Applied",false,true)}${s1?st(q.s1?(q.s1.ok?"✓ ":"✕ ")+nm(q.s1.by).split(" ")[0]:"Manager / head",q.st==="mgr",q.s1&&q.s1.ok,q.s1&&!q.s1.ok):""}${st(q.s2?(q.s2.ok?"✓ HR ":"✕ HR ")+nm(q.s2.by).split(" ")[0]:"HR",q.st==="hr",q.s2&&q.s2.ok,q.s2&&!q.s2.ok)}</div>`;}
function lvRow(q,u,act){const [lbl,cls]=LV_ST[q.st]||["",""];const paid=lvSum(q,true),lop=lvSum(q,false);const note=(q.s2&&q.s2.note)||(q.s1&&q.s1.note);
  return `<div class="lvrow">${u?av(u,32):""}<div style="flex:1;min-width:0">${u?`<strong>${esc(nm(u))}</strong> · `:""}<strong>${esc(lvRange(q))}</strong> <span class="xs muted">${lvSum(q)} day${lvSum(q)===1?"":"s"}${paid?` · ${paid} paid`:""}${lop?` · <span style="color:var(--bad)">${lop} unpaid</span>`:""}</span><div class="small">${esc(q.reason)}</div>${lvSteps(q,u||S.me)}${note?`<div class="xs muted" style="margin-top:3px">Note: ${esc(note)}</div>`:""}</div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="chip ${cls}">${lbl}</span>${act||""}</div></div>`;}
function viewLeave(){if(!S.me||!memberOf(S.me))return `<div class="wrap"><p>Join the CRM to apply for leave.</p></div>`;
  const ms=members();const me=leavesOf(S.me).slice().reverse();const ym=thisMonth();const used=paidUsedOn(S.me,ym);
  const todo=[];for(const u of Object.keys(ms))if(u!==S.me)for(const q of leavesOf(u))if(canStep1(q,u)||canStepHR(q,u))todo.push([q,u]);
  todo.sort((a,b)=>a[0].at-b[0].at);
  const act=(q,u)=>`<div class="row" style="gap:6px"><button class="btn sm" data-act="lv-ok" data-u="${esc(u)}" data-id="${esc(q.id)}">Approve</button><button class="btn sm ghost" data-act="lv-no" data-u="${esc(u)}" data-id="${esc(q.id)}">Reject</button></div>`;

/* ---------- AI credits ---------- */
const AI_SUGGEST=["Seedance","Runway","Kling","Adobe Firefly","Higgsfield","Hailuo","Pika","Luma","Midjourney","ElevenLabs","Topaz"];
const canBuyAI=()=>!!S.admin&&(isHR()||role(S.me)==="head");
const aiDoc=()=>S.ai||{};
const aiBuys=()=>(aiDoc().buys||[]).slice().sort((a,b)=>(a.day||"").localeCompare(b.day||"")||(a.at||0)-(b.at||0));
const aiKey=n=>String(n||"").trim().toLowerCase();
function aiUses(){const out=[];for(const [u,L] of Object.entries(S.logs||{}))for(const x of (L&&L.ai)||[])out.push(Object.assign({u},x));return out.sort((a,b)=>(a.at||0)-(b.at||0));}
function aiTools(){const m={};for(const b of aiBuys()){const k=aiKey(b.tool);if(!m[k])m[k]={name:b.tool.trim(),bought:0,spent:0,used:0,cost:0,over:0};m[k].bought+=Number(b.credits)||0;m[k].spent+=Number(b.price)||0;}return m;}
let _aiMemo={k:"",v:null};
function aiLedger(){const buys=aiBuys(),uses=aiUses();const key=JSON.stringify([buys.map(b=>[b.id,b.credits,b.price,b.tool]),uses.map(x=>[x.id,x.cr,x.tool])]);if(_aiMemo.k===key)return _aiMemo.v;
  const tools=aiTools();const lots={};for(const b of buys){const k=aiKey(b.tool);(lots[k]=lots[k]||[]).push({left:Number(b.credits)||0,rate:(Number(b.credits)>0?(Number(b.price)||0)/Number(b.credits):0)});}
  const cost={};for(const x of uses){const k=aiKey(x.tool);const t=tools[k]||(tools[k]={name:x.tool,bought:0,spent:0,used:0,cost:0,over:0});let need=Number(x.cr)||0,c=0;const L=lots[k]||[];t.used+=need;
    for(const lot of L){if(need<=0)break;const take=Math.min(lot.left,need);lot.left-=take;need-=take;c+=take*lot.rate;}

function viewAssigned(){
  if(!canSubs())return `<div class="wrap"><div class="panel"><h1 class="h2">Assigned</h1><p>Only managers, department heads and HR can see this page.</p></div></div>`;

  let toSum="";if(to){const all=mine.flatMap(c=>SS(c).map(s=>[c,s,rate(s,c.id)]));const dn=all.filter(x=>x[2].done);const late=all.filter(x=>!x[2].done&&x[1].day&&x[1].day<td).length;const mm=all.filter(x=>monthOf(x[1].day||dayOf(x[0].created||0))===m).length;
    toSum=`<div class="notice" style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center"><strong>${esc(who===S.me?"You":nm(who))} → ${esc(nm(to))}</strong><span>${all.length} subtask${all.length===1?"":"s"} in total</span><span>${mm} this month</span><span>${all.length-dn.length} open</span><span>${dn.length} finished</span>${late?`<span style="color:var(--bad);font-weight:700">${late} overdue</span>`:""}<span>${fmtMin(all.reduce((t,x)=>t+(Number(x[1].min)||0),0))} allotted</span></div>`;}
  let body="";
  if(tab==="upcoming"){const waitR=open.filter(c=>nextDay(c)==="9999");const up=open.filter(c=>nextDay(c)>=td&&nextDay(c)!=="9999").sort((a,b)=>nextDay(a).localeCompare(nextDay(b))||(a.created||0)-(b.created||0));
    const groups={};up.forEach(c=>{const d=nextDay(c);(groups[d]=groups[d]||[]).push(c);});

      +(waitR.length?`<section class="agroup"><h2 class="h2">Waiting for review <span class="muted" style="font-size:14px">${waitR.length} card${waitR.length>1?"s":""} · all steps finished, needs approval or moving on</span></h2><div class="agrid">${waitR.map(c=>assignedCardTile(c)).join("")}</div></section>`:"")
      +(Object.keys(groups).length?Object.entries(groups).map(([d,cs])=>`<section class="agroup"><h2 class="h2">${d===td?"Today":d===dayShift(td,1)?"Tomorrow":esc(fmtDay(d))} <span class="muted" style="font-size:14px">${cs.length} card${cs.length>1?"s":""} · next step due</span></h2><div class="agrid">${cs.map(c=>assignedCardTile(c,d)).join("")}</div></section>`).join(""):(waitR.length?"":`<p class="muted">No upcoming cards${who===S.me?" assigned by you":""}.</p>`));}
  else{const day=S.asgDay||td;const mode=S.asgMode||"due";
    const list=mode==="assigned"?mine.filter(c=>dayOf(c.created||0)===day):mine.filter(c=>SS(c).some(s=>s.day===day));
    list.sort((a,b)=>(a.created||0)-(b.created||0));
    const dayMin=mine.reduce((t,c)=>t+SS(c).filter(s=>s.day===day).reduce((a,s)=>a+(Number(s.min)||0),0),0);
    body=`<div class="row" style="gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sm ghost" data-act="asg-day" data-n="-1" aria-label="Previous day">‹</button><label class="sr" for="asgd">Day</label><input id="asgd" type="date" class="in" value="${day}" data-act-change="asg-pick" style="width:auto"><button class="btn sm ghost" data-act="asg-day" data-n="1" aria-label="Next day">›</button>${day!==td?`<button class="linkbtn small" data-act="asg-day" data-n="0">Today</button>`:""}
      <span class="row" role="radiogroup" aria-label="Show" style="gap:4px;margin-left:8px"><button class="heytab${mode==="due"?" on":""}" role="radio" aria-checked="${mode==="due"}" data-act="asg-mode" data-k="due">Work due that day</button><button class="heytab${mode==="assigned"?" on":""}" role="radio" aria-checked="${mode==="assigned"}" data-act="asg-mode" data-k="assigned">Assigned that day</button></span></div>
      <p class="small muted" style="margin:0">${mode==="assigned"?`${list.length} card${list.length===1?"":"s"} created ${who===S.me?"by you":"by "+esc(nm(who))} on ${esc(fmtDay(day))}.`:`${list.length} card${list.length===1?"":"s"} with subtasks allotted to ${esc(fmtDay(day))} – ${fmtMin(dayMin)} of work in total.`}</p>
      ${list.length?`<div class="agrid">${list.map(c=>assignedCardTile(c,mode==="due"?day:null)).join("")}</div>`:`<p class="muted">Nothing for this day.</p>`}`;}

   ${assignees.length?`<label class="small row" style="gap:6px">Assigned to<select class="in" data-act-change="asg-to" style="width:auto"><option value="">Everyone</option>${assignees.map(u=>`<option value="${esc(u)}" ${u===to?"selected":""}>${esc(nm(u))}</option>`).join("")}</select></label>`:""}</div>${toSum}
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    <div class="panel kpi"><span class="muted small">Open cards</span><strong>${open.length}</strong><span class="xs muted">not done yet</span></div>
    <div class="panel kpi"><span class="muted small">Work still to do</span><strong>${fmtMin(openMin)}</strong><span class="xs muted">allotted, unfinished subtasks</span></div>
    <div class="panel kpi"><span class="muted small">Overdue</span><strong style="color:${overdue.length?"var(--bad)":"inherit"}">${overdue.length}</strong><span class="xs muted">next step past its day</span></div>
    <div class="panel kpi"><span class="muted small">Done this month</span><strong>${doneM}</strong><span class="xs muted">of ${mine.length} assigned in total</span></div></div>
   <div class="row" role="tablist" aria-label="View" style="gap:6px"><button role="tab" aria-selected="${tab==="upcoming"}" class="heytab${tab==="upcoming"?" on":""}" data-act="asg-tab" data-k="upcoming">Upcoming</button><button role="tab" aria-selected="${tab==="daily"}" class="heytab${tab==="daily"?" on":""}" data-act="asg-tab" data-k="daily">Daily</button></div>
   ${body}</div>`;
}

document.addEventListener("drop",e=>{if(drag&&drag.tool){const z=e.target.closest&&e.target.closest("[data-droptool]");e.preventDefault();const g=document.getElementById("toolgrid");if(z&&g&&z.dataset.droptool!==drag.tool){const ids=[...g.querySelectorAll("[data-dragtool]")].map(x=>x.dataset.dragtool);const from=ids.indexOf(drag.tool),to=ids.indexOf(z.dataset.droptool);ids.splice(from,1);ids.splice(to,0,drag.tool);const pr=clone(S.prefs||{});pr.tools=pr.tools||{};pr.tools[g.dataset.cid]=ids;savePrefs(pr);}drag=null;document.querySelectorAll(".dropon").forEach(x=>x.classList.remove("dropon"));return;}if(drag&&drag.client){const z=e.target.closest&&e.target.closest("[data-dropclient]");e.preventDefault();if(z&&z.dataset.dropclient!==drag.client){const ids=[...document.querySelectorAll("[data-dragclient]")].map(x=>x.dataset.dragclient);const from=ids.indexOf(drag.client),to=ids.indexOf(z.dataset.dropclient);ids.splice(from,1);ids.splice(to,0,drag.client);const p=clone(S.prefs||{});p.clientOrder=ids;savePrefs(p);}drag=null;document.querySelectorAll(".dropon").forEach(x=>x.classList.remove("dropon"));return;}const z=e.target.closest&&e.target.closest("[data-dropcol]");if(!drag||!z){drag=null;return;}e.preventDefault();const to=z.dataset.dropcol,bid=z.dataset.bid;
  if(drag.card){const c=S.cards[drag.card];if(c&&canSubs()&&to!=="_lost"&&c.col!==to)moveCard(drag.card,to);}
  else if(drag.col&&drag.col!==to&&to!=="_lost"){const ids=viewCols(bid).map(k=>k.id).filter(x=>x!==drag.col);const at=ids.indexOf(to);const from=viewCols(bid).map(k=>k.id).indexOf(drag.col);ids.splice(from<viewCols(bid).map(k=>k.id).indexOf(to)?at+1:at,0,drag.col);saveOrder(bid,ids);}

/* ================= Welcome tour (different for staff, managers, heads, HR) ================= */
function tourKind(){if(S.owner||isHR())return "hr";const r=role(S.me);return r==="head"?"head":r==="manager"?"manager":"staff";}
const TOUR_KIND_NAME={hr:"HR / Admin",head:"Department head",manager:"Manager",staff:"Staff"};
function tourSteps(kind){
  const N=a=>`.nav a[href="#${a}"]`;
  const W={staff:"Here's a quick tour of what you'll use every day. It takes about a minute.",manager:"As a manager you assign and track your team's work. Here's a quick tour of the tools you'll use.",head:"As a department head you run your department's cards, people and approvals. Here's a quick tour.",hr:"As HR / Admin you can see and manage everything: people, attendance, salaries and reports. Here's a quick tour."}[kind];
  const s={
    welcome:{t:`Welcome to Nanma CRM, ${esc((nm(S.me)||"").split(" ")[0]||"there")}!`,x:W},
    mywork:{sel:N("my-work"),t:"My Work",x:"Your subtasks, sorted by when they're due. Press <b>Start</b> when you begin, <b>Stop</b> for a break and <b>Finish</b> when it's done. Your time is recorded automatically, and overdue work shows at the top in red."},
    finish:{t:"Finishing your work",x:"When you press <b>Finish</b>, add what you made: a link, a file or a short note. It goes to Internal approval so it can be checked. Production subtasks don't need this."},
    reviewStaff:{sel:N("review"),t:"Int. approval",x:"Designs, content and videos waiting for approval in your area. You can leave feedback for the person who assigned the work."},
    reviewLead:{sel:N("review"),t:"Int. approval",x:"Work waiting for internal approval. <b>Approve</b> to send it on, or <b>Send back</b> with notes on what to fix. The timer shows how long it has waited (office hours only, 9 to 6)."},
    cal:{sel:N("nanma-cal"),t:"Calendar",x:"Holidays, half days, team leave and shoots. Check here before you plan your week."},
    leave:{sel:N("leave"),t:"Leave",x:"Apply for leave here. It goes to your department head, then HR, and you can follow its status on this page."},
    leaveLead:{t:"Leave approvals",x:"When someone in your team applies for leave, it comes to you first. You'll see it in <b>Hey!</b> and on the <b>Leave</b> page."},
    newcard:{sel:'#main [data-act="new-card"]',t:"+ New card",x:"Start a new piece of work for a client. Pick a <b>Format</b> (Reel, Static, Carousel…) and the subtasks fill in with their times, or choose one of your own templates."},
    assign:{t:"Assigning subtasks",x:"On every card you can add subtasks, choose who does each one and set the minutes. The person sees it straight away in their My Work."},
    assigned:{sel:N("assigned"),t:"Assigned",x:"Everything you've assigned, by the day it's due. Filter by person to see how much each one has on their plate."},
    eff:{sel:N("efficiency"),t:"Efficiency",x:"How each person is doing on time and quality, so you can spot who is overloaded or falling behind."},
    logins:{sel:N("team"),t:kind==="hr"?"Team":"Logins",x:kind==="hr"?"Add people, set their role (Staff, Manager, Department head, Admin) and send them an invite link. Each person creates their own login from the link.":"Create or reset CRM logins for the people in your department."},
    att:{sel:N("attendance"),t:"Attendance",x:"Monthly attendance and salary. Import the eSSL report, check late marks and overtime, then <b>Finalise</b> the month. Only HR admins see this."},
    awards:{sel:N("awards"),t:"HR – Awards",x:"Monthly awards worked out from real work data: best designer, on-time delivery and more."},
    reports:{sel:N("reports"),t:"Reports",x:"Today, this week or any dates you choose: work done, late work and approval times, ready to copy and share."},
    billing:{sel:N("billing"),t:"Billing",x:"Put a price on cards so Accounts can bill them, and see what's been billed."},
    opcost:{sel:N("op-cost"),t:"Op. cost",x:"The office's running costs, used to work out what each hour of work costs."},
    activity:{sel:N("activity"),t:"Activity",x:"A log of everything that happened: who created, moved, approved or changed what, and when."},
    search:{sel:"#sq",t:"Search",x:"Find any person, client or card by typing a few letters."},
    hey:{sel:'a[href="#hey"]',t:"Hey!",x:"Your notifications: new work for you, mentions, feedback, leave updates and messages. The red number shows what's new."},
    dm:{sel:"#dmbtn",t:"Messages",x:"Chat privately with any colleague. You can drag this button anywhere on the screen."},
    help:{sel:N("help"),t:"Help",x:"Step-by-step guides for everything in the CRM. You can take this tour again from here any time."}
  };
  const order={

    manager:["welcome","newcard","assign","assigned","reviewLead","mywork","cal","leave","hey","dm","help"],
    head:["welcome","newcard","assign","assigned","reviewLead","eff","logins","leaveLead","reports","billing","hey","help"],
    hr:["welcome","logins","att","awards","newcard","assigned","reviewLead","eff","reports","billing","opcost","activity","search","hey","help"]
  }[kind];
  return order.map(k=>s[k]).filter(st=>!st.sel||document.querySelector(st.sel));

const TOUR={on:false,i:0,steps:[],kind:"",checked:false};
function tourRoot(){let r=document.getElementById("tour");if(!r){r=document.createElement("div");r.id="tour";document.body.appendChild(r);}return r;}
function tourStart(manual){
  TOUR.kind=tourKind();TOUR.checked=true;
  if(route().v!=="home"){location.hash="#home";}
  setTimeout(()=>{TOUR.steps=tourSteps(TOUR.kind);if(!TOUR.steps.length)return;TOUR.on=true;TOUR.i=0;tourDraw();},manual?350:250);
}
function tourEnd(){TOUR.on=false;tourRoot().innerHTML="";
  const p=clone(S.prefs||{});delete p.id;p.tourDone=Object.assign({},p.tourDone||{});p.tourDone[TOUR.kind]=Date.now();S.prefs=p;
  if(S.db&&S.me)S.db.doc("data/users/"+S.me+"/prefs").set(p).catch(()=>{});}
function tourDraw(){
  const r=tourRoot();if(!TOUR.on){r.innerHTML="";return;}
  const st=TOUR.steps[TOUR.i];const el=st.sel?document.querySelector(st.sel):null;
  const last=TOUR.i===TOUR.steps.length-1;
  r.innerHTML=`<div class="tour-hole" ${el?"":'data-none="1"'}></div><div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-t">
    <div class="tour-meta">${TOUR.i===0?esc(TOUR_KIND_NAME[TOUR.kind])+" tour":`${TOUR.i} of ${TOUR.steps.length-1}`}</div>
    <h2 id="tour-t">${st.t}</h2><p>${st.x}</p>
    <div class="tour-btns"><button type="button" class="linkbtn small" data-tour="skip">${last?"":"Skip tour"}</button><span style="flex:1"></span>${TOUR.i>0?`<button type="button" class="btn sm ghost" data-tour="back">Back</button>`:""}<button type="button" class="btn sm" data-tour="next">${last?"Finish":TOUR.i===0?"Start the tour":"Next"}</button></div></div>`;
  tourPlace();
  const nb=r.querySelector('[data-tour="next"]');if(nb)nb.focus();
}
function tourPlace(){
  if(!TOUR.on)return;const r=tourRoot();const hole=r.querySelector(".tour-hole"),card=r.querySelector(".tour-card");if(!hole||!card)return;
  const st=TOUR.steps[TOUR.i];const el=st.sel?document.querySelector(st.sel):null;
  const vw=innerWidth,vh=innerHeight,cw=Math.min(360,vw-24);card.style.width=cw+"px";
  if(!el||!el.getBoundingClientRect().width){hole.style.cssText="left:50%;top:50%;width:0;height:0";card.style.left=Math.round((vw-cw)/2)+"px";card.style.top=Math.round(vh/2-card.offsetHeight/2)+"px";return;}
  const b=el.getBoundingClientRect();const pad=6;
  if(b.top<0||b.bottom>vh)el.scrollIntoView({block:"center"});
  const c=el.getBoundingClientRect();
  hole.style.cssText=`left:${c.left-pad}px;top:${c.top-pad}px;width:${c.width+pad*2}px;height:${c.height+pad*2}px`;
  let left=Math.min(Math.max(12,c.left+c.width/2-cw/2),vw-cw-12);
  let top=c.bottom+14;if(top+card.offsetHeight>vh-12)top=Math.max(12,c.top-14-card.offsetHeight);
  card.style.left=left+"px";card.style.top=top+"px";
}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-tour]");if(!b||!TOUR.on)return;e.preventDefault();e.stopPropagation();
  const a=b.dataset.tour;if(a==="skip"){tourEnd();return;}if(a==="back"){TOUR.i=Math.max(0,TOUR.i-1);tourDraw();return;}
  if(TOUR.i>=TOUR.steps.length-1){tourEnd();toast("You're all set! Take the tour again any time from Help.");return;}TOUR.i++;tourDraw();},true);
document.addEventListener("keydown",e=>{if(!TOUR.on)return;if(e.key==="Escape"){tourEnd();}else if(e.key==="ArrowRight"){TOUR.i<TOUR.steps.length-1?(TOUR.i++,tourDraw()):tourEnd();}else if(e.key==="ArrowLeft"&&TOUR.i>0){TOUR.i--;tourDraw();}});
addEventListener("resize",()=>{if(TOUR.on)tourPlace();});
function tourMaybe(){
  if(TOUR.checked||TOUR.on||!S.me||!S.prefsLoaded||S.modal||S.fatal)return;
  if(!S.ready.joins||!S.ready.invites||!S.ready.team||!S.ready.cards)return;
  if(loginGate())return;if(!(memberOf(S.me)||S.owner))return;
  const k=tourKind();if(S.prefs&&S.prefs.tourDone&&S.prefs.tourDone[k]){TOUR.checked=true;return;}
  tourStart(false);
}
setInterval(tourMaybe,1500);

async function boot(){
  renderAll();
  if(!window.claude||!window.claude.use){S.fatal="Open this page from claude.ai while signed in to use the CRM.";renderAll();return;}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  S.db=db;S.user=user;
  if(!db){S.fatal="The CRM's data isn't available in this view. Open the page from claude.ai while signed in.";renderAll();return;}
  if(user){const me=await user.me();S.me=me.id;S.meP=me;S.owner=me.isOwner;S.editor=me.canEdit;S.admin=me.canEdit;if(me.id)S.prof[me.id]=me;}
  const slow=setTimeout(()=>{S.slow=true;renderAll();},10000);
  const ok=k=>{S.ready[k]=true;if(S.ready.cards){clearTimeout(slow);S.slow=false;}renderAll();};
  const fail=k=>e=>{S.ready[k]=true;if(e&&e.code==="revoked"){S.fatal="Your access to this page changed. Reload to continue.";}renderAll();};
  const docs=snap=>{const o={};for(const d of snap.docs){const v=d.data();if(v)o[d.id]=Object.assign({id:d.id},v);}return o;};
  db.collection("clients").onSnapshot(s=>{S.clients=docs(s);ok("clients");},fail("clients"));
  const mergeCards=()=>{S.cards=Object.assign({},S._pub||{},S._priv||{});S.trash={};for(const k of Object.keys(S.cards)){if(S.cards[k]&&S.cards[k].deleted){S.trash[k]=S.cards[k];delete S.cards[k];}}for(const c of Object.values(S.cards)){try{if(c.col==="triage"||(S.boards[c.board]&&!boardCols(c.board).some(k=>k.id===c.col))){const op=(c.subs||[]).find(x=>!rate(x,c.id).done);c.col=op?validStage(c,subStage(op)):(fixedOn(c.board,"int")?"int":firstCol(c));}}catch(_){}}scheduleAuto();};
  db.collection("cards").onSnapshot(s=>{S._pub=docs(s);mergeCards();if(!s.metadata.fromCache)ok("cards");else renderAll();},fail("cards"));
  if(S.editor)db.collection("pcards").onSnapshot(s=>{S._priv=docs(s);mergeCards();ok("pcards");},fail("pcards"));
  db.collection("timelogs").onSnapshot(s=>{S.logs=docs(s);ok("logs");scheduleAuto();},fail("logs"));
  const mergeComs=()=>{S.comments=Object.assign({},S._pc||{},S._ppc||{});};
  db.collection("comments").onSnapshot(s=>{S._pc=docs(s);mergeComs();ok("comments");},fail("comments"));
  if(S.editor)db.collection("pcomments").onSnapshot(s=>{S._ppc=docs(s);mergeComs();ok("pcomments");},fail("pcomments"));
  db.doc("crm/team").onSnapshot(d=>{S.team=d.exists?d.data():{};ok("team");},fail("team"));
  db.doc("crm/opcost").onSnapshot(d=>{S.oh=d.exists?d.data():{};renderAll();},()=>{});
  db.doc("crm/ai").onSnapshot(d=>{S.ai=d.exists?d.data():{};_aiMemo={k:"",v:null};renderAll();},()=>{});
  db.doc("crm/calendar").onSnapshot(d=>{S.ncal=d.exists?d.data():{};_spMemo={key:"",map:{}};ok("ncal");},fail("ncal"));
  if(S.me)db.doc("data/users/"+S.me+"/prefs").onSnapshot(d=>{S.prefs=d.exists?d.data():{};S.prefsLoaded=true;renderMain();},()=>{});
  {const A={};const am=()=>{S.activity=Object.assign({},A.a||{},A.p||{});const v=route().v;if(v==="activity"||v==="client")renderMain();};db.collection("activity").orderBy("at","desc").limit(800).onSnapshot(s=>{A.a=docs(s);am();},()=>{});if(S.editor)db.collection("pactivity").orderBy("at","desc").limit(400).onSnapshot(s=>{A.p=docs(s);am();},()=>{});}
  for(const k of ["todolists","todos","docs","checkins","answers","links","boosts"])db.collection(k).onSnapshot(s=>{S[k]=docs(s);ok(k);},fail(k));
  if(S.editor)db.collection("leads").onSnapshot(s=>{S.creds=docs(s);S.credsReady=true;if(route().v==="client")renderMain();},()=>{});
  S.ccal={};db.collection("ccal").onSnapshot(s=>{S.ccal=docs(s);ok("ccal");},fail("ccal"));
  db.collection("boards").onSnapshot(s=>{S.boards=docs(s);ok("boards");},fail("boards"));
  const M={};const merge=(k)=>{S[k]=Object.assign({},M[k]||{},M["p"+k]||{});};
  for(const k of ["messages","events"]){db.collection(k).onSnapshot(s=>{M[k]=docs(s);merge(k);ok(k);},fail(k));if(S.editor)db.collection("p"+k).onSnapshot(s=>{M["p"+k]=docs(s);merge(k);ok("p"+k);},fail("p"+k));}
  const chatSnap=k=>s=>{M[k]=docs(s);merge("chat");ok(k);const b=document.getElementById("chatbox");if(b)b.scrollTop=b.scrollHeight;};
  db.collection("chat").orderBy("at","desc").limit(1000).onSnapshot(chatSnap("chat"),fail("chat"));if(S.editor)db.collection("pchat").orderBy("at","desc").limit(1000).onSnapshot(chatSnap("pchat"),fail("pchat"));
  db.collection("invites").onSnapshot(s=>{S.invites=docs(s);ok("invites");},fail("invites"));
  db.collection("joins").onSnapshot(s=>{S.joins=docs(s);ok("joins");},fail("joins"));
}
boot();
