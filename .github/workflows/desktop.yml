name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Nanma-CRM-Setup
          path: desktop/dist/Nanma-CRM-Setup.exe
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Nanma CRM for Windows
          body: "Download **Nanma-CRM-Setup.exe** below, double-click it, and Nanma CRM installs with a desktop shortcut. If Windows says 'protected your PC', click More info → Run anyway."
          make_latest: true
          files: desktop/dist/Nanma-CRM-Setup.exe
